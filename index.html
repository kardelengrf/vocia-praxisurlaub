<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocia · Praxis-Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --vocia-deep-navy:#0D1B2A;--vocia-primary-blue:#1A73E8;--vocia-soft-gray:#E6E9EC;--vocia-fresh-green:#2BC48A;
  --text-primary:#262626;--text-secondary:#595959;--text-disabled:#8C8C8C;--outline:#D9D9D9;
  --state-error:#F5222D;--state-warning:#FAAD14;--state-success:#52C41A;
  --blue-900:#003A8C;--blue-600:#1890FF;--blue-300:#91D5FF;--blue-100:#E6F7FF;
  --orange-900:#871400;--orange-600:#FA541C;--orange-300:#FFBB96;--orange-100:#FFF2E8;
  --green-900:#135200;--green-300:#B7EB8F;--green-100:#F6FFED;
  --cyan-600:#13C2C2;--cyan-100:#E6FFFB;
  /* Soft gray at 45% on white: canvas + panel tint */
  --canvas:#F4F5F6;--surface:#FFFFFF;
  --font-sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;
  --radius-control:10px;--radius-card:16px;--radius-main:24px;
  --ease:cubic-bezier(0.2,0,0,1);
  --shadow-card:0 0 0 1px rgba(13,27,42,.06),0 1px 2px rgba(13,27,42,.04);
  --shadow-raised:0 0 0 1px rgba(13,27,42,.06),0 2px 4px rgba(13,27,42,.04),0 8px 24px rgba(13,27,42,.06);
  --shadow-float:0 0 0 1px rgba(13,27,42,.06),0 12px 32px rgba(13,27,42,.14),0 32px 64px rgba(13,27,42,.10);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--text-primary);font-family:var(--font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#app{height:100%}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn svg.i,.pill svg.i,b svg.i{stroke-width:2}
:focus-visible{outline:2px solid var(--vocia-primary-blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text-secondary)}
.num{font-variant-numeric:tabular-nums}

/* ---------- Shell: rail | panel | main ---------- */
.shell{display:grid;grid-template-columns:80px 264px minmax(0,1fr);height:100%}
.shell.nopanel{grid-template-columns:80px minmax(0,1fr)}
.rail{background:var(--vocia-deep-navy);display:flex;flex-direction:column;align-items:center;padding:var(--space-6) 0 var(--space-4);gap:var(--space-1);overflow-y:auto}
.logo{display:grid;place-items:center;width:48px;height:48px;margin-bottom:var(--space-6)}
.logo img{width:32px;height:auto;display:block}
.rbtn{position:relative;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;border:0;background:transparent;color:rgba(230,233,236,.62);cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease),scale 150ms var(--ease)}
.rbtn svg.i{width:22px;height:22px}
.rbtn:hover{color:#fff;background:rgba(230,233,236,.06)}
.rbtn:active{scale:.96}
.rbtn[aria-current="page"]{color:#fff;background:rgba(230,233,236,.14);box-shadow:inset 0 0 0 1px rgba(230,233,236,.10)}
.rbtn[aria-current="page"]::after{content:"";position:absolute;right:-16px;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--vocia-primary-blue)}
.rbtn:focus-visible{outline-color:#fff}
.rbtn .tip{position:absolute;left:58px;top:50%;translate:0 -50%;background:var(--vocia-deep-navy);color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms var(--ease);z-index:50;box-shadow:0 4px 12px rgba(13,27,42,.25)}
.rbtn:hover .tip,.rbtn:focus-visible .tip{opacity:1}
.rbtn .badge{position:absolute;top:8px;right:8px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--vocia-primary-blue);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--vocia-deep-navy)}
.rsep{width:32px;height:1px;background:rgba(230,233,236,.12);margin:var(--space-2) 0}
.avatar{margin-top:auto;width:40px;height:40px;border-radius:50%;background:rgba(230,233,236,.14);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}

.panel{padding:var(--space-8) var(--space-4) var(--space-4);display:flex;flex-direction:column;overflow-y:auto}
.panel h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0 var(--space-3) var(--space-1)}
.panel .pp{font-size:13px;color:var(--text-secondary);margin:0 var(--space-3) var(--space-6)}
.pgroup+.pgroup{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--outline)}
.plabel{font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 var(--space-3) var(--space-2)}
.pitem{display:flex;align-items:center;gap:var(--space-3);width:100%;padding:10px var(--space-3);border-radius:12px;border:0;background:transparent;font-size:15px;font-weight:500;text-align:left;cursor:pointer;color:var(--text-primary);transition:background-color 150ms var(--ease),box-shadow 150ms var(--ease),scale 150ms var(--ease)}
.pitem:hover{background:rgba(13,27,42,.04)}
.pitem:active{scale:.98}
.pitem[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow-raised);font-weight:600}
.pitem .cnt{margin-left:auto;font-size:14px;color:var(--text-secondary);font-weight:500}
.pitem .i{color:var(--text-secondary)}
.pitem[aria-current="true"] .i{color:var(--vocia-primary-blue)}
.pitem:disabled{cursor:default;color:var(--text-disabled)}
.pitem:disabled .i{color:var(--text-disabled)}
.pitem .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface);box-shadow:0 0 0 1px var(--outline);flex:none;color:var(--text-secondary)}
.pitem[aria-current="true"] .dot{background:var(--vocia-primary-blue);color:#fff;box-shadow:none}
.pitem.done .dot{background:var(--green-100);color:var(--green-900);box-shadow:0 0 0 1px var(--green-300)}
.pitem .dot .i{width:13px;height:13px;color:inherit;stroke-width:2.5}
.pfoot{margin-top:auto;padding:var(--space-4) var(--space-3) 0}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary);cursor:pointer}
.switch input{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--outline);position:relative;cursor:pointer;margin:0;flex:none;transition:background-color 150ms var(--ease)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:translate 150ms var(--ease)}
.switch input:checked{background:var(--vocia-primary-blue)}
.switch input:checked::after{translate:14px 0}

.mainwrap{padding:var(--space-2) var(--space-2) var(--space-2) 0;min-width:0;min-height:0}
.nopanel .mainwrap{padding-left:var(--space-2)}
.main{height:100%;overflow:auto;background:var(--surface);border-radius:var(--radius-main);box-shadow:var(--shadow-card);position:relative}
.page{max-width:1040px;margin:0 auto;padding:var(--space-10) var(--space-10) 96px}
.mchips{display:none}

.eyebrow{font-size:13px;font-weight:600;color:var(--text-secondary);margin:0 0 var(--space-1)}
h1{font-size:36px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:0}
h2{font-size:22px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:16px;font-weight:700;margin:0}
.lead{color:var(--text-secondary);margin:var(--space-2) 0 0;max-width:62ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);margin-bottom:var(--space-8);flex-wrap:wrap}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.section{margin-top:var(--space-12);scroll-margin-top:var(--space-6)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.cap{font-size:12px;color:var(--text-secondary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);min-height:40px;padding:0 var(--space-4);border-radius:var(--radius-control);border:0;background:var(--surface);box-shadow:0 0 0 1px var(--outline),0 1px 2px rgba(13,27,42,.04);color:var(--text-primary);font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background-color 150ms var(--ease),box-shadow 150ms var(--ease),color 150ms var(--ease),scale 150ms var(--ease)}
.btn:hover{box-shadow:0 0 0 1px var(--text-disabled),0 1px 2px rgba(13,27,42,.06)}
.btn:active{scale:.96}
.btn.primary{background:var(--vocia-primary-blue);color:#fff;box-shadow:0 1px 2px rgba(13,27,42,.12),inset 0 1px 0 rgba(255,255,255,.14)}
.btn.primary:hover{background:#155FC0}
.btn.dark{background:var(--vocia-deep-navy);color:#fff;box-shadow:none}
.btn.dark:hover{background:#1B2B3D}
.btn.ghost{background:transparent;box-shadow:none;color:var(--vocia-primary-blue)}
.btn.ghost:hover{background:var(--blue-100)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--text-secondary)}
.btn.quiet:hover{background:rgba(13,27,42,.04);color:var(--text-primary)}
.btn.sm{min-height:32px;padding:0 var(--space-3);font-size:13px;border-radius:8px}
.btn.icon{width:40px;padding:0}
.btn.sm.icon{width:32px}
.btn[aria-busy="true"]{opacity:.75;cursor:progress}
.btn:disabled{cursor:not-allowed}
.danger .i{color:var(--state-error)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;opacity:.8}
@keyframes sp{to{transform:rotate(360deg)}}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:600;white-space:nowrap}
.pill .i{width:14px;height:14px}
.pill.ok{background:var(--green-100);color:var(--green-900);box-shadow:inset 0 0 0 1px var(--green-300)}
.pill.info{background:var(--blue-100);color:var(--blue-900);box-shadow:inset 0 0 0 1px var(--blue-300)}
.pill.warn{background:var(--orange-100);color:var(--orange-900);box-shadow:inset 0 0 0 1px var(--orange-300)}
.pill.err{background:var(--surface);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--state-error)}
.pill.err .i{color:var(--state-error)}
.pill.muted{background:var(--vocia-soft-gray);color:var(--text-secondary)}
.pill.dark{background:rgba(230,233,236,.12);color:#fff}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}
.card.pad{padding:var(--space-6)}
.card.soft{background:var(--canvas);box-shadow:none}
.grid{display:grid;gap:var(--space-4)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

/* Stats */
.stat{padding:var(--space-6);border-radius:20px;background:var(--surface);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:var(--space-1);min-height:148px}
.stat .lbl{font-size:14px;font-weight:600;color:var(--text-secondary)}
.stat .big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:auto}
.stat .big small{font-size:20px;font-weight:600;letter-spacing:0;margin-left:2px}
.stat .def{font-size:12px;color:var(--text-secondary)}
.stat.green{background:var(--green-100);box-shadow:inset 0 0 0 1px var(--green-300)}
.hero{background:var(--vocia-deep-navy);color:#fff;border-radius:20px;padding:var(--space-8);display:flex;flex-direction:column;gap:var(--space-4);min-height:100%;position:relative;overflow:hidden}
.hero .status{display:flex;align-items:center;gap:var(--space-2);font-size:14px;font-weight:600;color:rgba(230,233,236,.82)}
.hero .status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--vocia-fresh-green);box-shadow:0 0 0 4px rgba(43,196,138,.18)}
.hero .huge{font-size:88px;font-weight:700;letter-spacing:-.05em;line-height:.95;margin-top:auto}
.hero .sub{font-size:15px;color:rgba(230,233,236,.72)}
.hero .row{display:flex;gap:var(--space-6);padding-top:var(--space-4);border-top:1px solid rgba(230,233,236,.14);flex-wrap:wrap}
.hero .row b{display:block;font-size:22px;font-weight:700}
.hero .row span{font-size:13px;color:rgba(230,233,236,.72)}
.hero .mark{position:absolute;right:-28px;top:-20px;width:220px;opacity:.06;pointer-events:none}

/* Lists / tables */
.list .row{display:grid;align-items:center;gap:var(--space-4);padding:var(--space-4) var(--space-6);width:100%;border:0;background:transparent;text-align:left;cursor:pointer;transition:background-color 150ms var(--ease)}
.list .row+.row{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.list button.row:hover{background:var(--canvas)}
.list .hd{cursor:default;font-size:12px;font-weight:600;color:var(--text-secondary);padding-top:var(--space-3);padding-bottom:var(--space-3)}
.list .row:first-child{border-radius:var(--radius-card) var(--radius-card) 0 0}
.list .row:last-child{border-radius:0 0 var(--radius-card) var(--radius-card)}
.calls .row{grid-template-columns:64px minmax(0,1.6fr) minmax(0,1fr) 64px 170px 20px}
.tasks .row{grid-template-columns:minmax(0,2fr) 110px minmax(0,1fr) 150px 180px 20px}
.ops .row{grid-template-columns:110px minmax(0,1.4fr) 120px 160px}
.zt .row{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 120px 210px}
.team .row{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 120px minmax(0,1fr)}
.t1{font-weight:600}
.t2{font-size:13px;color:var(--text-secondary)}
.chev{color:var(--text-disabled);width:16px;height:16px}
.empty{padding:var(--space-10) var(--space-6);text-align:center;color:var(--text-secondary)}
.empty .i{width:28px;height:28px;color:var(--text-disabled);margin-bottom:var(--space-2)}
.empty b{display:block;color:var(--text-primary);font-weight:700;margin-bottom:var(--space-1)}
.rowacts{display:flex;gap:var(--space-1);justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
.chip .i{width:14px;height:14px}

.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:var(--space-3) var(--space-6);margin:0}
.kv dt{color:var(--text-secondary);font-size:14px}
.kv dd{margin:0;font-weight:500}
.hours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-2)}
.day{padding:var(--space-4) var(--space-3);border-radius:14px;background:var(--canvas);font-size:13px}
.day b{display:block;font-size:14px;margin-bottom:var(--space-1)}
.day.closed{color:var(--text-disabled)}

/* Integration / check rows */
.irow{display:flex;gap:var(--space-4);align-items:flex-start}
.ibox{width:44px;height:44px;border-radius:12px;background:var(--canvas);display:grid;place-items:center;flex:none}
.ibox .i{width:22px;height:22px}
.irow .body{flex:1;min-width:0}
.health{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0}
.health+.health{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.health .body{flex:1}
.cando{display:grid;grid-template-columns:24px 1fr auto;gap:var(--space-3);align-items:start;padding:var(--space-4) 0}
.cando+.cando{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.cando .i.ok{color:var(--state-success)}
.cando .i.no{color:var(--text-disabled)}

/* Messages */
.msg{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:12px;font-size:14px;margin-top:var(--space-3)}
.msg .i{margin-top:2px}
.msg.info{background:var(--blue-100);color:var(--blue-900)}
.msg.warn{background:var(--orange-100);color:var(--orange-900)}
.msg.ok{background:var(--green-100);color:var(--green-900)}
.msg.err{background:var(--surface);box-shadow:inset 0 0 0 1px var(--state-error)}
.msg.err .i{color:var(--state-error)}
.msg .body{flex:1}
.banner{margin:0 0 var(--space-6);align-items:center}
.hint{display:flex;justify-content:space-between;align-items:center;gap:var(--space-4);flex-wrap:wrap;padding:var(--space-4) var(--space-6);border-radius:var(--radius-card);background:var(--canvas);margin-bottom:var(--space-4)}
.hint p{margin:0;max-width:52ch}

/* Tabs */
.tabs{display:flex;gap:var(--space-1);padding:4px;border-radius:12px;background:var(--canvas)}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:background-color 150ms var(--ease),color 150ms var(--ease),box-shadow 150ms var(--ease)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-card)}

/* Chart */
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-4);align-items:end;height:220px;padding-top:var(--space-4)}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bar .seg{border-radius:4px;min-height:3px}
.bar .seg:first-child{border-radius:8px 8px 4px 4px}
.seg.s{background:var(--vocia-primary-blue)}
.seg.h{background:var(--blue-300)}
.seg.f{background:var(--orange-600)}
.xl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-4);margin-top:var(--space-2);font-size:12px;color:var(--text-secondary);text-align:center}
.xl b{display:block;color:var(--text-primary);font-size:13px}
.legend{display:flex;gap:var(--space-4);flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rank{display:grid;gap:var(--space-3)}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:var(--space-3);align-items:center;font-size:14px}
.rank .track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--canvas);overflow:hidden}
.rank .track div{height:100%;border-radius:4px;background:var(--blue-300)}

/* Forms (flow) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.field label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
.field label em{font-style:normal;font-weight:400;color:var(--text-secondary)}
.field input,.field textarea{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--vocia-soft-gray);padding:0 var(--space-4);font-size:15px;transition:box-shadow 150ms var(--ease),background-color 150ms var(--ease)}
.field textarea{min-height:160px;padding:var(--space-4);line-height:1.6;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;background:var(--surface);box-shadow:inset 0 0 0 2px var(--vocia-primary-blue)}
.field [aria-invalid="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--state-error)}
.ferr{display:flex;gap:6px;align-items:flex-start;font-size:13px;margin:6px 0 0}
.ferr .i{width:16px;height:16px;color:var(--state-error);margin-top:1px}
.derived{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2);margin-top:var(--space-4)}
.derived>div{padding:var(--space-4);border-radius:14px;background:var(--canvas)}
.derived>div.mid{background:var(--vocia-deep-navy);color:#fff}
.derived small{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:2px}
.derived .mid small,.derived .mid .t2{color:rgba(230,233,236,.72)}
.derived b{font-weight:700;font-size:16px}
.check{display:flex;gap:var(--space-3);align-items:flex-start;cursor:pointer;font-size:15px}
.check input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--vocia-primary-blue);flex:none}
.check small{display:block;color:var(--text-secondary);font-size:13px}
.boxed{padding:var(--space-4);border-radius:14px;box-shadow:inset 0 0 0 1px var(--vocia-soft-gray)}
.boxed.invalid{box-shadow:inset 0 0 0 2px var(--state-error)}
.opts{display:grid;gap:var(--space-2);grid-template-columns:1fr 1fr}
.opt{display:grid;grid-template-columns:18px 1fr;gap:var(--space-3);padding:var(--space-4);border-radius:14px;box-shadow:inset 0 0 0 1px var(--vocia-soft-gray);cursor:pointer;transition:box-shadow 150ms var(--ease),background-color 150ms var(--ease)}
.opt input{margin:3px 0 0;width:18px;height:18px;accent-color:var(--vocia-primary-blue)}
.opt b{font-weight:700;display:block}
.opt span{display:block;color:var(--text-secondary);font-size:14px}
.opt:has(input:checked){background:var(--blue-100);box-shadow:inset 0 0 0 2px var(--vocia-primary-blue)}
.vform{margin-top:var(--space-3);display:grid;gap:var(--space-4);padding:var(--space-4);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-card)}
.appts{margin:var(--space-2) 0 0;padding:0;list-style:none;font-size:14px}
.appts li{display:grid;grid-template-columns:120px 56px 1fr;gap:var(--space-2);padding:6px 0;box-shadow:inset 0 1px 0 var(--orange-300)}
.block{margin-top:var(--space-8)}
.block>h3{margin-bottom:var(--space-3)}
.toolrow{display:flex;gap:var(--space-2);margin-top:var(--space-3);flex-wrap:wrap}
details.legal{margin-top:var(--space-6);border-radius:14px;box-shadow:inset 0 0 0 1px var(--vocia-soft-gray);font-size:14px}
details.legal summary{padding:var(--space-3) var(--space-4);cursor:pointer;font-weight:600}
details.legal ul{margin:0;padding:0 var(--space-4) var(--space-3) var(--space-8);color:var(--text-secondary)}
.flowfoot{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 var(--vocia-soft-gray);padding:var(--space-3) var(--space-10);display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);border-radius:0 0 var(--radius-main) var(--radius-main)}
.flowfoot .pos{font-size:13px;color:var(--text-secondary)}
.flowpage{max-width:780px;margin:0 auto;padding:var(--space-10) var(--space-10) var(--space-12)}

/* Caller preview */
.sim{padding:var(--space-6);border-radius:20px;background:var(--canvas)}
.simhd{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);font-size:13px;color:var(--text-secondary);flex-wrap:wrap}
.conv{display:flex;flex-direction:column;gap:var(--space-3)}
.m{max-width:86%;font-size:15px;line-height:1.55}
.m .who{font-size:12px;font-weight:600;color:var(--text-secondary);margin:0 0 4px;display:flex;align-items:center;gap:6px}
.m .txt{padding:12px 16px;border-radius:18px}
.m.v{align-self:flex-start}
.m.v .who::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--vocia-fresh-green)}
.m.v .txt{background:var(--surface);border-top-left-radius:6px;box-shadow:var(--shadow-card)}
.m.c{align-self:flex-end}
.m.c .who{justify-content:flex-end}
.m.c .txt{background:var(--vocia-deep-navy);color:#fff;border-top-right-radius:6px}
.m mark{background:var(--blue-100);color:var(--blue-900);padding:0 4px;border-radius:4px;font-weight:600}
.summary .ci{display:grid;grid-template-columns:22px 1fr auto;gap:var(--space-3);align-items:start;padding:var(--space-4) var(--space-6)}
.summary .ci+.ci{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.summary .ci .i.ok{color:var(--state-success)}
.summary .ci .i.wn{color:var(--orange-600)}
.summary .ci small{display:block;font-size:13px;color:var(--text-secondary)}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(13,27,42,.32);z-index:30;animation:fade 200ms var(--ease)}
.drawer{position:fixed;top:8px;right:8px;bottom:8px;width:min(480px,calc(100vw - 16px));background:var(--surface);border-radius:var(--radius-main);box-shadow:var(--shadow-float);z-index:31;display:flex;flex-direction:column;animation:slide 240ms var(--ease)}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--space-3);padding:var(--space-6) var(--space-6) var(--space-4)}
.drawer .db{padding:0 var(--space-6) var(--space-6);overflow:auto;flex:1}
.drawer .df{padding:var(--space-4) var(--space-6);box-shadow:inset 0 1px 0 var(--vocia-soft-gray);display:flex;gap:var(--space-2);justify-content:flex-end;flex-wrap:wrap}
.dsec{margin-top:var(--space-6)}
.dsec h3{font-size:13px;color:var(--text-secondary);font-weight:600;margin-bottom:var(--space-2)}
.locked{display:flex;gap:var(--space-3);align-items:center;padding:var(--space-3) var(--space-4);border-radius:12px;background:var(--canvas);font-size:14px;color:var(--text-secondary)}
@keyframes slide{from{translate:24px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* Notes, modal, toast */
.note{display:none;background:var(--orange-100);color:var(--orange-900);font-size:13px;line-height:1.45;padding:var(--space-2) var(--space-3);border-radius:10px;margin:var(--space-3) 0;box-shadow:inset 3px 0 0 var(--orange-600)}
.note b{font-weight:700}
body.notes .note{display:block}
.overlay{position:fixed;inset:0;background:rgba(13,27,42,.45);display:grid;place-items:center;z-index:40;padding:var(--space-4);animation:fade 150ms var(--ease)}
.modal{background:var(--surface);border-radius:var(--radius-main);width:min(460px,100%);padding:var(--space-8);box-shadow:var(--shadow-float)}
.modal h2{font-size:20px;margin-bottom:var(--space-2)}
.modal p{margin:0 0 var(--space-3);color:var(--text-secondary)}
.modal ul{margin:0 0 var(--space-6);padding-left:20px;color:var(--text-secondary);font-size:14px}
.modal .acts{justify-content:flex-end;margin-top:var(--space-6)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 8px;background:var(--vocia-deep-navy);color:#fff;padding:8px 8px 8px 16px;border-radius:14px;font-size:14px;display:flex;gap:var(--space-3);align-items:center;opacity:0;pointer-events:none;transition:opacity 150ms var(--ease),translate 150ms var(--ease);z-index:60;max-width:calc(100vw - 32px);box-shadow:var(--shadow-float);min-height:44px}
.toast.show{opacity:1;translate:-50% 0;pointer-events:auto}
.toast .btn{min-height:32px;background:rgba(230,233,236,.14);color:#fff;box-shadow:none}

@media (max-width:1100px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .calls .row{grid-template-columns:56px minmax(0,1fr) 150px 20px}
  .calls .row .c-dur,.calls .row .c-topic2{display:none}
  .tasks .row{grid-template-columns:minmax(0,1fr) 150px 20px}
  .tasks .row .t-prio,.tasks .row .t-owner,.tasks .row .t-due{display:none}
}
@media (max-width:900px){
  .shell,.shell.nopanel{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{flex-direction:row;justify-content:flex-start;padding:var(--space-2) var(--space-3);overflow-x:auto;gap:2px}
  .logo{margin:0 var(--space-2) 0 0;width:40px;height:40px;flex:none}
  .logo img{width:26px}
  .rbtn{flex:none;width:44px;height:44px}
  .rbtn .tip,.rsep,.avatar{display:none}
  .rbtn[aria-current="page"]::after{right:12px;left:12px;top:auto;bottom:-6px;width:auto;height:3px}
  .panel{display:none}
  .mainwrap,.nopanel .mainwrap{padding:0}
  .main{border-radius:0;box-shadow:none}
  .mchips{display:flex;gap:var(--space-2);overflow-x:auto;margin:calc(var(--space-4) * -1) calc(var(--space-4) * -1) var(--space-6);padding:0 var(--space-4) 2px}
  .mchips .pitem{width:auto;flex:none;white-space:nowrap;padding:6px 12px;background:var(--canvas)}
  .mchips .pitem[aria-current="true"]{background:var(--vocia-deep-navy);color:#fff;box-shadow:none}
  .mchips .pitem[aria-current="true"] .i,.mchips .pitem[aria-current="true"] .cnt{color:#fff}
  .page,.flowpage{padding:var(--space-8) var(--space-4) 96px}
  h1{font-size:30px}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .hero .huge{font-size:64px}
  .flowfoot{padding:var(--space-3) var(--space-4);border-radius:0}
  .grid2,.opts,.derived{grid-template-columns:minmax(0,1fr)}
  .hours{grid-template-columns:repeat(2,minmax(0,1fr))}
  .list .hd{display:none}
  .calls .row,.tasks .row{grid-template-columns:minmax(0,1fr) auto;padding:var(--space-4)}
  .calls .row .c-time,.list .row .chev{display:none}
  .ops .row,.zt .row,.team .row{grid-template-columns:minmax(0,1fr) auto;padding:var(--space-4)}
  .ops .row>:nth-child(1),.team .row>:nth-child(4){display:none}
  .zt .row .kind{display:none}
  .zt .row .rowacts{grid-column:1 / -1;justify-content:flex-start}
  .chart{gap:var(--space-2)}
  .xl{gap:var(--space-2)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Holiday flow ---------- */
const STEPS=['Zeitraum & Termine','Notfall & Vertretung','Ansage','Prüfen & veröffentlichen'];
function gen(d){
  let t=`Willkommen bei der ${PRAXIS}. Hier spricht Vocia, die digitale Assistentin der Praxis. Die Praxis ist im Urlaub und ab ${long(d.reopen)} wieder für Sie da.`;
  if(d.mention){
    if(d.emergency==='vertretung'&&d.vName.trim()&&d.vPhone.trim())t+=` In dringenden Fällen wenden Sie sich bitte an unsere Vertretung, ${d.vName.trim()}, Telefon ${d.vPhone.trim()}.`;
    else if(d.emergency==='standard')t+=` In dringenden Fällen erreichen Sie den zahnärztlichen Notdienst unter ${STD.phone}.`;
  }
  return t+' Gerne nehme ich Ihr Anliegen auf, damit sich das Praxisteam nach dem Urlaub bei Ihnen meldet.';
}
const ansageOf=d=>d.edited?d.ansage:gen(d);
function errs1(d){const e={};
  if(!d.start)e.start='Bitte wählen Sie den ersten geschlossenen Tag.';
  else if(d.start<TODAY&&!S.editingId)e.start='Der Urlaub kann nicht in der Vergangenheit beginnen.';
  if(!d.reopen)e.reopen='Bitte wählen Sie den Tag, an dem die Praxis wieder öffnet.';
  else if(d.start&&d.reopen<=d.start)e.reopen='Der Tag der Wiedereröffnung muss nach dem ersten geschlossenen Tag liegen.';
  return e}
function errs2(d){const e={};
  if(d.emergency==='vertretung'){if(!d.vName.trim())e.vName='Bitte geben Sie den Namen der Vertretungspraxis an.';if(!d.vPhone.trim())e.vPhone='Bitte geben Sie eine Telefonnummer an. Vocia nennt keine unbestätigten Kontaktdaten.'}
  if(!d.verified)e.verified='Bitte bestätigen Sie, dass Sie die Angaben geprüft haben.';
  return e}
function warn3(d){const t=ansageOf(d),w=[];
  if(!t.trim())return ['Die Ansage ist leer. Vocia braucht einen Text.'];
  if(!/digitale Assistentin|KI|Vocia/.test(t))w.push('Der Hinweis, dass hier eine digitale Assistentin spricht, fehlt. Anrufer müssen darüber informiert werden.');
  if(d.edited&&!t.includes(long(d.reopen))&&!t.includes(fmtS(d.reopen)))w.push(`Der Tag der Wiedereröffnung (${long(d.reopen)}) fehlt im Text.`);
  if(d.edited&&d.mention&&d.emergency==='vertretung'&&d.vName.trim()&&!t.includes(d.vName.trim()))w.push(`Die Vertretung (${d.vName.trim()}) wird im Text nicht genannt.`);
  return w}
const stepErrs=n=>n===1?errs1(S.draft):n===2?errs2(S.draft):n===3&&!ansageOf(S.draft).trim()?{ansage:'Die Ansage ist leer.'}:{};
const overlaps=d=>S.items.filter(i=>i.id!==S.editingId&&i.start<=lastDay(d)&&i.end>=d.start);
const apptsIn=d=>APPTS.filter(a=>a.d>=d.start&&a.d<=lastDay(d));
const fieldErr=(n,k,e)=>S.tried[n]&&e[k]?`<p class="ferr" id="e-${k}">${ic('err')}<span>${e[k]}</span></p>`:'';
const inv=(n,k,e)=>S.tried[n]&&e[k]?`aria-invalid="true" aria-describedby="e-${k}"`:'';

function step1(d){
  const e=errs1(d);
  let o=`<p class="eyebrow">Schritt 1 von 4</p><h1 id="steph" tabindex="-1">Wann ist die Praxis geschlossen?</h1>
  <p class="lead" style="margin-bottom:32px">Geben Sie den Zeitraum einmal ein. Terminsperre, Ansage und Notfallkontakt werden daraus abgeleitet.</p>
  <div class="grid2">
    <div class="field"><label for="f-start">Erster geschlossener Tag</label><input id="f-start" type="date" value="${d.start}" data-field="start" ${inv(1,'start',e)}>${fieldErr(1,'start',e)}</div>
    <div class="field"><label for="f-reopen">Wieder geöffnet am</label><input id="f-reopen" type="date" value="${d.reopen}" data-field="reopen" ${inv(1,'reopen',e)}>${fieldErr(1,'reopen',e)}</div>
  </div>
  <div class="note"><b>"Wieder geöffnet am" instead of an end date.</b> Teams think "we're back on Monday"; this removes off-by-one mismatches.</div>`;
  if(!e.start&&!e.reopen){
    o+=`<div class="derived"><div><small>Letzter Öffnungstag</small><b>${long(lastOpen(d.start))}</b></div>
      <div class="mid"><small>Geschlossen</small><b>${fmtS(d.start)} – ${fmtS(lastDay(d))}</b><div class="t2">${workdays(d)} Werktage</div></div>
      <div><small>Wieder geöffnet</small><b>${long(d.reopen)}</b></div></div>`;
    const ov=overlaps(d);
    if(ov.length)o+=`<div class="msg warn">${ic('alert')}<div class="body"><b>Überschneidung:</b> ${ov.map(x=>`${x.kind} ${fmtS(x.start)}–${fmtS(x.end)}`).join(', ')}. Bitte prüfen Sie, ob beide Einträge nötig sind.</div></div>`;
    const a=apptsIn(d);
    o+=`<div class="block"><h3>Termine</h3>
      <label class="check boxed"><input type="checkbox" data-field="block" ${d.block?'checked':''}><span>Keine neuen Termine in diesem Zeitraum buchen<small>Vocia vergibt telefonisch keine Termine. Endet automatisch mit dem Urlaub.</small></span></label>
      ${a.length?`<div class="msg warn">${ic('alert')}<div class="body"><b>${a.length} bestehende ${a.length===1?'Termin liegt':'Termine liegen'} im Zeitraum.</b> Vocia sagt sie nicht automatisch ab. Bitte buchen Sie sie um.
        <ul class="appts">${a.map(x=>`<li><span>${WD[D(x.d).getDay()].slice(0,2)}, ${fmt(x.d)}</span><span>${x.t}</span><span>${x.what}</span></li>`).join('')}</ul></div></div>`
      :`<div class="msg ok">${ic('checkc')}<div class="body">Keine bestehenden Termine im Zeitraum.</div></div>`}</div>`;
  }
  return o;
}
function step2(d){
  const e=errs2(d);
  return `<p class="eyebrow">Schritt 2 von 4</p><h1 id="steph" tabindex="-1">Wohin in dringenden Fällen?</h1>
  <p class="lead" style="margin-bottom:32px">Vocia nennt diesen Kontakt, wenn Anrufer nach Notdienst oder Vertretung fragen.</p>
  <fieldset style="border:0;padding:0;margin:0"><legend class="sr">Notfallkontakt</legend><div class="opts">
    <label class="opt"><input type="radio" name="emergency" value="standard" data-field="emergency" ${d.emergency==='standard'?'checked':''}><div><b>Standard-Notdienst</b><span>${STD.type}, ${STD.phone}</span></div></label>
    <label class="opt"><input type="radio" name="emergency" value="vertretung" data-field="emergency" ${d.emergency==='vertretung'?'checked':''}><div><b>Vertretungspraxis</b><span>Eine Kollegenpraxis übernimmt.</span></div></label>
  </div></fieldset>
  ${d.emergency==='vertretung'?`<div class="vform">

    <div class="grid2">
      <div class="field"><label for="f-vName">Name der Praxis</label><input id="f-vName" type="text" autocomplete="off" value="${esc(d.vName)}" data-field="vName" data-live="1" ${inv(2,'vName',e)}>${fieldErr(2,'vName',e)}</div>
      <div class="field"><label for="f-vPhone">Telefonnummer</label><input id="f-vPhone" type="tel" value="${esc(d.vPhone)}" data-field="vPhone" data-live="1" ${inv(2,'vPhone',e)}>${fieldErr(2,'vPhone',e)}</div>
    </div>
    <div class="field"><label for="f-vAddr">Adresse <em>(optional)</em></label><input id="f-vAddr" type="text" value="${esc(d.vAddr)}" data-field="vAddr" data-live="1"></div>
  </div>`:''}
  <div class="block grid" style="gap:8px">
    <label class="check boxed"><input type="checkbox" data-field="mention" ${d.mention?'checked':''}><span>Notfallkontakt direkt in der Ansage nennen<small>Viele Anrufer fragen sonst trotzdem nach.</small></span></label>
    <label class="check boxed ${S.tried[2]&&e.verified?'invalid':''}"><input id="f-verified" type="checkbox" data-field="verified" ${d.verified?'checked':''} ${inv(2,'verified',e)}><span>Ich habe die Angaben geprüft<small>Name, Telefonnummer und Erreichbarkeit während des Urlaubs. Das Prüfdatum wird gespeichert.</small></span></label>
    ${fieldErr(2,'verified',e)}
  </div>
  <div class="note"><b>Emergency before announcement.</b> Once the contact is verified, the announcement names it automatically; no unverified number reaches a patient.</div>`;
}
function step3(d){
  const w=warn3(d);
  return `<p class="eyebrow">Schritt 3 von 4</p><h1 id="steph" tabindex="-1">Was hören Anrufer?</h1>
  <p class="lead" style="margin-bottom:32px">Der Text wurde aus Zeitraum und Notfallkontakt erstellt. Sie können ihn anpassen.</p>
  <div class="field"><label for="f-ansage">Urlaubsansage</label><textarea id="f-ansage" data-field="ansage" data-live="1">${esc(ansageOf(d))}</textarea></div>
  <div class="toolrow"><button class="btn" data-action="listen">${ic('play')}Anhören</button><button class="btn ghost" id="regenBtn" data-action="regen" ${d.edited?'':'hidden'}>${ic('refresh')}Text neu erstellen</button></div>
  <div id="ansWarn" aria-live="polite">${w.map(x=>`<div class="msg warn">${ic('alert')}<div class="body">${esc(x)}</div></div>`).join('')}</div>
  <details class="legal"><summary>Datenschutz & Transparenz</summary><ul><li>Anrufer müssen erfahren, dass sie mit einer digitalen Assistentin sprechen.</li><li>Die genaue Formulierung stimmt Ihre Praxis mit der zuständigen Datenschutzstelle ab.</li></ul></details>`;
}
function step4(d){
  const last=lastDay(d),a=apptsIn(d),active=d.start<=TODAY;
  const emerg=d.emergency==='vertretung'?`Bitte wenden Sie sich an unsere Vertretung, <mark>${esc(d.vName)}</mark>, Telefon <mark>${esc(d.vPhone)}</mark>.`:`Bitte wenden Sie sich an den zahnärztlichen Notdienst unter <mark>${STD.phone}</mark>.`;
  const book=d.block?`Die Praxis ist bis einschließlich <mark>${long(last)}</mark> geschlossen. Ich kann Ihren Terminwunsch aufnehmen. Das Praxisteam meldet sich ab <mark>${long(d.reopen)}</mark> bei Ihnen. Der Termin ist damit noch nicht bestätigt.`:`Ich schaue nach freien Terminen ab <mark>${long(d.reopen)}</mark>.`;
  return `<p class="eyebrow">Schritt 4 von 4</p><h1 id="steph" tabindex="-1">So erlebt ein Anrufer Ihren Urlaub</h1>
  <p class="lead" style="margin-bottom:32px">Ein Beispielgespräch mit Ihren Einstellungen. Prüfen Sie es und veröffentlichen Sie den Urlaub.</p>
  <div class="sim"><div class="simhd"><span>Beispielanruf am ${long(active?TODAY:d.start)}</span><button class="btn sm" data-action="listen">${ic('play')}Ansage anhören</button></div>
    <div class="conv">
      <div class="m v"><div class="who">Vocia</div><div class="txt">${esc(ansageOf(d))}</div></div>
      <div class="m c"><div class="who">Anrufer</div><div class="txt">Kann ich diese Woche noch einen Termin bekommen?</div></div>
      <div class="m v"><div class="who">Vocia</div><div class="txt">${book}</div></div>
      <div class="m c"><div class="who">Anrufer</div><div class="txt">Mir ist ein Bracket abgebrochen und es tut ziemlich weh.</div></div>
      <div class="m v"><div class="who">Vocia</div><div class="txt">${emerg}</div></div>
    </div></div>
  <div class="note"><b>Honest status language.</b> Vocia says "I can note your request", never "your appointment is confirmed".</div>
  <div class="block"><h3>Zusammenfassung</h3><div class="card summary">
    <div class="ci">${ic('checkc','ok')}<div>Geschlossen ${fmt(d.start)} – ${fmt(last)}, wieder geöffnet ${long(d.reopen)}<small>${d.block?'Keine neuen Termine im Zeitraum':'Termine bleiben buchbar'}</small></div><button class="btn ghost sm" data-action="step" data-step="1">Ändern</button></div>
    ${a.length?`<div class="ci">${ic('alert','wn')}<div>${a.length} bestehende ${a.length===1?'Termin':'Termine'} im Zeitraum<small>Werden nicht automatisch abgesagt. Bitte umbuchen.</small></div><button class="btn ghost sm" data-action="step" data-step="1">Ansehen</button></div>`:''}
    <div class="ci">${ic('checkc','ok')}<div>Notfälle: ${d.emergency==='vertretung'?esc(d.vName):'Standard-Notdienst'}<small>Geprüft am ${fmt(d.verifiedOn||TODAY)}${d.mention?' · wird in der Ansage genannt':''}</small></div><button class="btn ghost sm" data-action="step" data-step="2">Ändern</button></div>
    <div class="ci">${ic('checkc','ok')}<div>Urlaubsansage<small>Danach gilt automatisch wieder die Standard-Begrüßung</small></div><button class="btn ghost sm" data-action="step" data-step="3">Ändern</button></div>
  </div>
  <div class="msg info">${ic('info')}<div class="body">${active?'<b>Der Urlaub läuft bereits.</b> Änderungen gelten sofort nach dem Veröffentlichen.':`Wird am <b>${long(d.start)}</b> um 00:00 Uhr automatisch aktiv und endet vor der Öffnung am <b>${long(d.reopen)}</b>.`}</div></div></div>`;
}
function flowView(){
  return `<div style="display:flex;flex-direction:column;min-height:100%"><div class="flowpage" style="flex:1;width:100%">${mchips()}${[step1,step2,step3,step4][S.step-1](S.draft)}</div>

    </div></div></div>`;
}

function refreshLive(){const d=S.draft;if(!d)return;
  const aw=document.getElementById('ansWarn');if(aw)aw.innerHTML=warn3(d).map(x=>`<div class="msg warn">${ic('alert')}<div class="body">${esc(x)}</div></div>`).join('');

let tt,undoFn=null;
function toast(msg,undo){const t=document.getElementById('toast');undoFn=undo||null;
  t.innerHTML=`<span>${esc(msg)}</span>${undo?`<button class="btn sm" data-action="undo">${ic('undo')}Rückgängig</button>`:''}`;
  t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>{t.classList.remove('show');undoFn=null},undo?6000:2600)}
function speak(text){try{if(!('speechSynthesis' in window))throw 0;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';speechSynthesis.speak(u);toast('Wird vorgelesen')}catch(_){toast('Vorlesen wird in diesem Browser nicht unterstützt')}}
const leaveFlow=()=>{S.view=S.origin;S.draft=null;S.editingId=null;S.dirty=false;S.tried={};S.top=true};
const nowHM=()=>{const n=new Date();return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,d=S.draft;
  switch(a){
    case 'stub':toast('Nicht Teil dieses Prototyps');return;
    case 'nav':{
      const to=el.dataset.view;
      if(S.view==='flow'&&S.dirty){S.modal={type:'discard',then:to};break}
      if(S.view==='flow')leaveFlow();
      S.drawer=null;S.view=to;S.origin=to;S.banner=null;S.top=true;break}
    case 'filter':S.sub[S.view]=el.dataset.id;S.top=true;break;
    case 'anchor':{S.sub[S.view]=el.dataset.id;render();const sec=document.getElementById('sec-'+el.dataset.id);if(sec){sec.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}return}
    case 'plan':S.origin=el.dataset.origin||'zeiten';S.draft=newDraft();S.editingId=null;S.step=1;S.maxStep=1;S.dirty=false;S.tried={};S.banner=null;S.view='flow';S.top=true;S.focus='#steph';break;
    case 'edit':{const it=S.items.find(i=>i.id===+el.dataset.id);if(!it||!it.draft)return;
      S.origin=S.view;S.draft=JSON.parse(JSON.stringify(it.draft));S.editingId=it.id;S.step=+(el.dataset.step||4);S.maxStep=4;S.dirty=false;S.tried={};S.banner=null;S.view='flow';S.top=true;S.focus='#steph';break}
    case 'delete':S.modal={type:'delete',id:+el.dataset.id,ret:`[data-action="delete"][data-id="${el.dataset.id}"]`};break;
    case 'closeModal':if(el.classList.contains('overlay')&&e.target!==el)return;{const r=S.modal&&S.modal.ret;S.modal=null;S.focus=r||null}break;
    case 'confirmDelete':{const it=S.items.find(i=>i.id===S.modal.id);S.items=S.items.filter(i=>i.id!==S.modal.id);S.modal=null;S.banner=`${it.kind} ${fmtS(it.start)}–${fmtS(it.end)} wurde gelöscht.`;S.focus='h1';break}
    case 'discard':{const to=S.modal.then;S.modal=null;leaveFlow();if(to){S.view=to;S.origin=to}break}
    case 'dismiss':S.banner=null;break;
    case 'openCall':S.drawer={type:'call',id:el.dataset.id,ret:S.drawer?S.drawer.ret:`[data-id="${el.dataset.id}"]`};S.focus='#dtitle';break;
    case 'openTask':
      if(S.view!=='aufgaben'&&!S.drawer){S.view='aufgaben';S.origin='aufgaben'}
      S.drawer={type:'task',id:el.dataset.id,ret:S.drawer?S.drawer.ret:`[data-action="openTask"][data-id="${el.dataset.id}"]`};S.focus='#dtitle';break;
    case 'closeDrawer':{const r=S.drawer&&S.drawer.ret;S.drawer=null;S.focus=r;break}
    case 'assign':{const t=TASKS.find(x=>x.id===el.dataset.id);t.owner=ME;if(t.status==='neu')t.status='zugewiesen';toast(`${t.id} ist Ihnen zugewiesen`);break}
    case 'done':{const t=TASKS.find(x=>x.id===el.dataset.id);const prev={status:t.status,owner:t.owner};t.status='erledigt';t.owner=t.owner||ME;S.drawer=null;
      toast(`${t.id} als erledigt markiert`,()=>{t.status=prev.status;t.owner=prev.owner;render()});S.focus='h1';break}
    case 'reopen':{const t=TASKS.find(x=>x.id===el.dataset.id);t.status=t.owner?'zugewiesen':'neu';toast(`${t.id} wieder geöffnet`);break}
    case 'undo':if(undoFn){undoFn();undoFn=null;document.getElementById('toast').classList.remove('show')}return;
    case 'testcall':S.test={state:'busy',at:S.test.at};render();setTimeout(()=>{S.test={state:'ok',at:`Heute, ${nowHM()}`};render()},1400);return;
    case 'intcheck':{const id=el.dataset.id;S.intCheck[id]='busy';render();setTimeout(()=>{S.intCheck[id]='ok';render()},1000);return}
    case 'say':speak(el.dataset.text);return;
    case 'step':{const n=+el.dataset.step;if(n>S.maxStep)return;S.step=n;S.top=true;S.focus='#steph';break}
    case 'next':{const er=stepErrs(S.step);
      if(Object.keys(er).length){S.tried[S.step]=true;render();const f=document.querySelector('[aria-invalid="true"]');if(f)f.focus();return}
      if(S.step===2&&!d.verifiedOn)d.verifiedOn=TODAY;
      S.step++;S.maxStep=Math.max(S.maxStep,S.step);S.top=true;S.focus='#steph';break}
    case 'back':S.step=Math.max(1,S.step-1);S.top=true;S.focus='#steph';break;
    case 'cancel':if(S.dirty){S.modal={type:'discard'};break}leaveFlow();break;
    case 'useLast':d.vName=LAST_V.name;d.vPhone=LAST_V.phone;d.vAddr=LAST_V.addr;S.dirty=true;break;
    case 'regen':d.edited=false;d.ansage='';break;
    case 'listen':speak(ansageOf(d));return;
    case 'publish':{if(S.busy)return;S.busy=true;render();
      setTimeout(()=>{const saved=JSON.parse(JSON.stringify(d));saved.ansage=ansageOf(d);saved.verifiedOn=d.verifiedOn||TODAY;
        const item={id:S.editingId||Date.now(),kind:'Urlaub',start:d.start,end:lastDay(d),draft:saved};
        S.items=S.editingId?S.items.map(i=>i.id===S.editingId?item:i):[...S.items,item];
        S.banner=item.start<=TODAY?`<b>Urlaub ${fmtS(item.start)}–${fmtS(item.end)} veröffentlicht.</b> Die Änderungen sind jetzt aktiv.`:`<b>Urlaub ${fmtS(item.start)}–${fmtS(item.end)} veröffentlicht.</b> Vocia übernimmt ihn automatisch am ${long(item.start)}.`;
        S.busy=false;leaveFlow();S.view='zeiten';S.origin='zeiten';S.sub.zeiten='urlaub';S.focus='h1';render();
        const sec=document.getElementById('sec-urlaub');if(sec)sec.scrollIntoView({block:'start'});
      },700);return}
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target,f=t.dataset&&t.dataset.field;if(!f)return;
  if(f==='notes'){S.notes=t.checked;render();return}
  const d=S.draft;if(!d||t.dataset.live)return;
  S.dirty=true;
  if(t.type==='checkbox'){d[f]=t.checked;if(f==='verified')d.verifiedOn=t.checked?TODAY:null}
  else if(t.type==='radio'){d[f]=t.value;if(f==='emergency'){d.verified=false;d.verifiedOn=null}}
  else if(t.type==='date'){d[f]=t.value;if(f==='start'&&d.start&&d.reopen&&d.reopen<=d.start)d.reopen=addDays(d.start,7)}
  S.focus=t.type==='radio'?`input[name="${t.name}"][value="${t.value}"]`:'#'+t.id;
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.live||!S.draft)return;
  const d=S.draft;S.dirty=true;
  if(t.dataset.field==='ansage'){d.ansage=t.value;d.edited=true}
  else{d[t.dataset.field]=t.value;d.verified=false;d.verifiedOn=null;const v=document.getElementById('f-verified');if(v)v.checked=false}
  refreshLive();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(S.modal){const r=S.modal.ret;S.modal=null;S.focus=r||null;render()}
  else if(S.drawer){const r=S.drawer.ret;S.drawer=null;S.focus=r;render()}
});
window.addEventListener('beforeunload',e=>{if(S.view==='flow'&&S.dirty){e.preventDefault();e.returnValue=''}});
render();
})();
</script>
</body>
</html>
