<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocia · Praxis-Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --vocia-deep-navy:#0D1B2A;--vocia-primary-blue:#1A73E8;--vocia-soft-gray:#E6E9EC;--vocia-fresh-green:#2BC48A;
  --text-primary:#262626;--text-secondary:#595959;--text-disabled:#8C8C8C;--outline:#D9D9D9;
  --state-error:#F5222D;--state-warning:#FAAD14;--state-success:#52C41A;
  --blue-900:#003A8C;--blue-300:#91D5FF;--blue-100:#E6F7FF;
  --orange-900:#871400;--orange-600:#FA541C;--orange-300:#FFBB96;--orange-100:#FFF2E8;
  --green-900:#135200;--green-300:#B7EB8F;--green-100:#F6FFED;
  --canvas:#F4F5F6;--surface:#FFFFFF;
  --font-sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(0.2,0,0,1);
  --shadow-card:0 0 0 1px rgba(13,27,42,.06),0 1px 2px rgba(13,27,42,.04);
  --shadow-raised:0 0 0 1px rgba(13,27,42,.06),0 2px 4px rgba(13,27,42,.04),0 8px 24px rgba(13,27,42,.06);
  --shadow-float:0 0 0 1px rgba(13,27,42,.06),0 12px 32px rgba(13,27,42,.14),0 32px 64px rgba(13,27,42,.10);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--vocia-soft-gray);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn svg.i,.pill svg.i{stroke-width:2}
:focus-visible{outline:2px solid var(--vocia-primary-blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 16:9 stage ---------- */
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));background:var(--canvas);overflow:hidden;box-shadow:0 24px 64px rgba(13,27,42,.14)}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}

/* Sidebar */
.side{background:var(--canvas);border-right:1px solid #E9EBED;display:flex;flex-direction:column;padding:22px 14px 14px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.brand img{height:21px;width:auto;display:block}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--vocia-deep-navy)}
.ws{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--surface);box-shadow:0 0 0 1px #E6E9EC;margin-bottom:14px}
.ws>div{min-width:0}
.wsi{width:30px;height:30px;border-radius:8px;background:var(--vocia-deep-navy);color:#fff;display:grid;place-items:center;flex:none}
.wsi .i{width:16px;height:16px}
.ws small{display:block;font-size:11.5px;color:var(--text-secondary);line-height:1.3}
.ws b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nlabel{font-size:12px;font-weight:500;color:var(--text-disabled);margin:16px 10px 4px}
.nitem{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:1px 0;border-radius:10px;border:0;background:transparent;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;text-align:left;transition:background-color 150ms var(--ease),color 150ms var(--ease),scale 150ms var(--ease)}
.nitem:hover{color:var(--text-primary);background:rgba(13,27,42,.04)}
.nitem:active{scale:.98}
.nitem[aria-current="page"]{background:var(--surface);color:var(--text-primary);font-weight:600;box-shadow:0 0 0 1px #E6E9EC,0 1px 2px rgba(13,27,42,.04)}
.nitem[aria-current="page"] .i{color:var(--vocia-primary-blue)}
.nitem .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--vocia-primary-blue);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.sfoot{margin-top:auto;display:grid;gap:12px}
.pnote{display:none;background:var(--orange-100);color:var(--orange-900);font-size:12.5px;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:inset 3px 0 0 var(--orange-600)}
.notes .pnote{display:block}
.pnote b{display:block;font-weight:700;margin-bottom:2px}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary);cursor:pointer;padding:0 10px}
.switch input{appearance:none;width:32px;height:18px;border-radius:9px;background:var(--outline);position:relative;cursor:pointer;margin:0;flex:none;transition:background-color 150ms var(--ease)}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:translate 150ms var(--ease)}
.switch input:checked{background:var(--vocia-primary-blue)}
.switch input:checked::after{translate:14px 0}
.user{display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid #E9EBED}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--vocia-soft-gray);font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.mainwrap{min-width:0;min-height:0}
.main{height:100%;overflow:auto;background:var(--surface)}
.page{height:100%;display:flex;flex-direction:column;gap:22px;padding:30px 40px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex:none}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--text-secondary);margin:0 0 2px}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:0}
h3{font-size:15px;font-weight:700;margin:0}
.lead{color:var(--text-secondary);margin:6px 0 0;max-width:72ch}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.body{flex:1;min-height:0;display:grid;gap:16px}
.body>*{min-height:0;min-width:0}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.t1{font-weight:600}
.t2{font-size:12.5px;color:var(--text-secondary)}
.cap{font-size:12px;color:var(--text-secondary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:10px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--outline),0 1px 2px rgba(13,27,42,.04);color:var(--text-primary);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background-color 150ms var(--ease),box-shadow 150ms var(--ease),color 150ms var(--ease),scale 150ms var(--ease)}
.btn:hover{box-shadow:0 0 0 1px var(--text-disabled),0 1px 2px rgba(13,27,42,.06)}
.btn:active{scale:.96}
.btn.primary{background:var(--vocia-primary-blue);color:#fff;box-shadow:0 1px 2px rgba(13,27,42,.12),inset 0 1px 0 rgba(255,255,255,.14)}
.btn.primary:hover{background:#155FC0}
.btn.ghost{background:transparent;box-shadow:none;color:var(--vocia-primary-blue)}
.btn.ghost:hover{background:var(--blue-100)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--text-secondary)}
.btn.quiet:hover{background:rgba(13,27,42,.04);color:var(--text-primary)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.icon{width:36px;padding:0}
.btn.sm.icon{width:30px}
.btn[aria-busy="true"]{opacity:.75;cursor:progress}
.danger .i{color:var(--state-error)}
.spin{width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;opacity:.8}
@keyframes sp{to{transform:rotate(360deg)}}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill .i{width:13px;height:13px}
.pill.ok{background:var(--green-100);color:var(--green-900);box-shadow:inset 0 0 0 1px var(--green-300)}
.pill.info{background:var(--blue-100);color:var(--blue-900);box-shadow:inset 0 0 0 1px var(--blue-300)}
.pill.warn{background:var(--orange-100);color:var(--orange-900);box-shadow:inset 0 0 0 1px var(--orange-300)}
.pill.err{background:var(--surface);color:var(--text-primary);box-shadow:inset 0 0 0 1px var(--state-error)}
.pill.err .i{color:var(--state-error)}
.pill.muted{background:var(--vocia-soft-gray);color:var(--text-secondary)}

/* Cards */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-card);padding:20px;display:flex;flex-direction:column;min-height:0}
.card.flat{padding:0}
.card.soft{background:var(--canvas);box-shadow:none}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex:none}
.scroll{overflow:auto;min-height:0;flex:1}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,30%{box-shadow:0 0 0 2px var(--vocia-primary-blue),var(--shadow-card)}100%{box-shadow:var(--shadow-card)}}
.end{margin-top:auto}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{padding:18px 20px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:2px}
.stat .lbl{font-size:13px;font-weight:600;color:var(--text-secondary)}
.stat .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin-top:auto;padding-top:12px}
.stat .big small{font-size:17px;font-weight:600;letter-spacing:0;margin-left:2px}
.stat .def{font-size:12px;color:var(--text-secondary)}
.stat.green{background:var(--green-100);box-shadow:inset 0 0 0 1px var(--green-300)}

/* Lists */
.list{display:flex;flex-direction:column}
.list .row{display:grid;align-items:center;gap:16px;padding:0 20px;min-height:46px;width:100%;border:0;background:transparent;text-align:left;cursor:pointer;transition:background-color 150ms var(--ease)}
.list .row+.row{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.list button.row:hover{background:var(--canvas)}
.list .hd{cursor:default;font-size:12px;font-weight:600;color:var(--text-secondary);min-height:38px}
.list .row:first-child{border-radius:16px 16px 0 0}
.list .row:last-child{border-radius:0 0 16px 16px}
.calls .row{grid-template-columns:56px minmax(0,1.8fr) minmax(0,1fr) 56px 160px 16px}
.tasks .row{grid-template-columns:minmax(0,2fr) 100px minmax(0,1fr) 150px 170px 16px;min-height:54px}
.ops .row{grid-template-columns:96px minmax(0,1fr) 80px 140px}
.zt .row{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 110px 200px;min-height:60px;padding-top:10px;padding-bottom:10px}
.team .row{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 100px minmax(0,1fr)}
.chev{color:var(--text-disabled);width:16px;height:16px}
.empty{padding:28px 20px;text-align:center;color:var(--text-secondary)}
.empty .i{width:26px;height:26px;color:var(--text-disabled);margin-bottom:6px}
.empty b{display:block;color:var(--text-primary);font-weight:700;margin-bottom:2px}
.rowacts{display:flex;gap:4px;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary)}
.chip .i{width:13px;height:13px}
.mini{display:flex;align-items:center;gap:12px;width:100%;padding:10px 0;border:0;background:transparent;text-align:left;cursor:pointer;border-radius:0}
.mini+.mini{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.mini:hover .t1{color:var(--vocia-primary-blue)}

.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:8px 20px;margin:0}
.kv dt{color:var(--text-secondary);font-size:13px}
.kv dd{margin:0;font-weight:500}
.hours{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;flex:1}
.day{padding:12px;border-radius:12px;background:var(--canvas);font-size:12.5px;line-height:1.5}
.day b{display:block;font-size:13.5px;margin-bottom:4px}
.day.closed{color:var(--text-disabled)}

.irow{display:flex;gap:14px;align-items:flex-start}
.ibox{width:40px;height:40px;border-radius:11px;background:var(--canvas);display:grid;place-items:center;flex:none}
.ibox .i{width:20px;height:20px}
.irow .bd{flex:1;min-width:0}
.health{display:flex;align-items:center;gap:12px;padding:10px 0}
.health+.health{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.health .bd{flex:1}
.cando{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:12px 0}
.cando+.cando{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.cando .i.ok{color:var(--state-success)}
.cando .i.no{color:var(--text-disabled)}

/* Messages */
.msg{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;font-size:13px;margin-top:12px}
.msg .i{margin-top:1px;width:16px;height:16px}
.msg.info{background:var(--blue-100);color:var(--blue-900)}
.msg.warn{background:var(--orange-100);color:var(--orange-900)}
.msg.ok{background:var(--green-100);color:var(--green-900)}
.msg .bd{flex:1}
.msg.banner{margin:0 0 12px;align-items:center}
.hint{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--canvas);margin-bottom:12px;font-size:13px}
.hint p{margin:0}

.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--canvas)}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text-secondary);cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-card)}

/* Chart */
.chart{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px;align-items:end;padding-top:8px}
.bar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bar .seg{border-radius:4px;min-height:3px}
.bar .seg:first-child{border-radius:8px 8px 4px 4px}
.seg.s{background:var(--vocia-primary-blue)}
.seg.h{background:var(--blue-300)}
.seg.f{background:var(--orange-600)}
.xl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:16px;margin-top:8px;font-size:12px;color:var(--text-secondary);text-align:center}
.xl b{display:block;color:var(--text-primary);font-size:13px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rank{display:grid;gap:14px}
.rank .r{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:6px 10px;align-items:center;font-size:13.5px}
.rank .track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--canvas);overflow:hidden}
.rank .track div{height:100%;border-radius:4px;background:var(--blue-300)}

/* Flow */
.page.flow{padding-bottom:0}
.flowfoot{flex:none;margin:0 -40px;padding:12px 40px;box-shadow:inset 0 1px 0 var(--vocia-soft-gray);display:flex;justify-content:space-between;align-items:center;gap:12px}
.flowfoot .pos{font-size:12.5px;color:var(--text-secondary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field label em{font-style:normal;font-weight:400;color:var(--text-secondary)}
.field input,.field textarea{width:100%;min-height:44px;border:0;border-radius:11px;background:var(--canvas);box-shadow:inset 0 0 0 1px var(--vocia-soft-gray);padding:0 14px;font-size:14px;transition:box-shadow 150ms var(--ease),background-color 150ms var(--ease)}
.field textarea{min-height:0;height:210px;padding:14px;line-height:1.6;resize:none}
.field input:focus,.field textarea:focus{outline:none;background:var(--surface);box-shadow:inset 0 0 0 2px var(--vocia-primary-blue)}
.field [aria-invalid="true"]{background:var(--surface);box-shadow:inset 0 0 0 2px var(--state-error)}
.ferr{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;margin:6px 0 0}
.ferr .i{width:15px;height:15px;color:var(--state-error);margin-top:1px}
.derived{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.derived>div{padding:14px;border-radius:13px;background:var(--canvas)}
.derived>div.mid{background:var(--vocia-deep-navy);color:#fff}
.derived small{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:2px}
.derived .mid small,.derived .mid .t2{color:rgba(230,233,236,.72)}
.derived b{font-weight:700;font-size:15px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:14px}
.check input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--vocia-primary-blue);flex:none}
.check small{display:block;color:var(--text-secondary);font-size:12.5px}
.boxed{padding:14px;border-radius:13px;box-shadow:inset 0 0 0 1px var(--vocia-soft-gray)}
.boxed.invalid{box-shadow:inset 0 0 0 2px var(--state-error)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:18px 1fr;gap:12px;padding:14px;border-radius:13px;box-shadow:inset 0 0 0 1px var(--vocia-soft-gray);cursor:pointer;transition:box-shadow 150ms var(--ease),background-color 150ms var(--ease)}
.opt input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--vocia-primary-blue)}
.opt b{font-weight:700;display:block}
.opt span{display:block;color:var(--text-secondary);font-size:13px}
.opt:has(input:checked){background:var(--blue-100);box-shadow:inset 0 0 0 2px var(--vocia-primary-blue)}
.vform{display:grid;gap:12px;padding:14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow-card)}
.appts{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.appts li{display:grid;grid-template-columns:116px 48px 1fr;gap:8px;padding:6px 0;box-shadow:inset 0 1px 0 var(--orange-300)}
.toolrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.legal ul{margin:0;padding-left:18px;color:var(--text-secondary);font-size:13px;display:grid;gap:6px}

.sim{padding:18px;border-radius:18px;background:var(--canvas);display:flex;flex-direction:column;min-height:0}
.simhd{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;font-size:12.5px;color:var(--text-secondary)}
.conv{display:flex;flex-direction:column;gap:8px}
.m{max-width:90%;font-size:13.5px;line-height:1.5}
.m .who{font-size:11.5px;font-weight:600;color:var(--text-secondary);margin:0 0 3px;display:flex;align-items:center;gap:6px}
.m .txt{padding:9px 13px;border-radius:16px}
.m.v{align-self:flex-start}
.m.v .who::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--vocia-fresh-green)}
.m.v .txt{background:var(--surface);border-top-left-radius:5px;box-shadow:var(--shadow-card)}
.m.c{align-self:flex-end}
.m.c .who{justify-content:flex-end}
.m.c .txt{background:var(--vocia-deep-navy);color:#fff;border-top-right-radius:5px}
.m mark{background:var(--blue-100);color:var(--blue-900);padding:0 4px;border-radius:4px;font-weight:600}
.summary .ci{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:start;padding:12px 0}
.summary .ci+.ci{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.summary .ci .i.ok{color:var(--state-success)}
.summary .ci .i.wn{color:var(--orange-600)}
.summary .ci small{display:block;font-size:12.5px;color:var(--text-secondary)}

/* Overlays (contained in the stage) */
.scrim{position:absolute;inset:0;background:rgba(13,27,42,.32);z-index:30;animation:fade 200ms var(--ease)}
.drawer{position:absolute;top:10px;right:10px;bottom:10px;width:460px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow-float);z-index:31;display:flex;flex-direction:column;animation:slide 240ms var(--ease)}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:24px 24px 4px}
.drawer h2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.drawer .db{padding:0 24px 20px;overflow:auto;flex:1}
.drawer .df{padding:14px 24px;box-shadow:inset 0 1px 0 var(--vocia-soft-gray);display:flex;gap:8px;justify-content:flex-end}
.dsec{margin-top:20px}
.dsec h3{font-size:12.5px;color:var(--text-secondary);font-weight:600;margin-bottom:8px}
.dsec p{margin:0}
.locked{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--canvas);font-size:13px;color:var(--text-secondary)}
@keyframes slide{from{translate:24px 0;opacity:0}to{translate:0 0;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay{position:absolute;inset:0;background:rgba(13,27,42,.45);display:grid;place-items:center;z-index:40;animation:fade 150ms var(--ease)}
.modal{background:var(--surface);border-radius:20px;width:460px;padding:28px;box-shadow:var(--shadow-float)}
.modal h2{font-size:20px;font-weight:700;margin:0 0 8px}
.modal p{margin:0 0 10px;color:var(--text-secondary)}
.modal ul{margin:0;padding-left:20px;color:var(--text-secondary);font-size:13.5px}
.modal .acts{justify-content:flex-end;margin-top:24px}
.toast{position:absolute;left:50%;bottom:24px;translate:-50% 8px;background:var(--vocia-deep-navy);color:#fff;padding:7px 7px 7px 16px;border-radius:13px;font-size:13.5px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:opacity 150ms var(--ease),translate 150ms var(--ease);z-index:60;box-shadow:var(--shadow-float);min-height:42px}
.toast.show{opacity:1;translate:-50% 0;pointer-events:auto}
.toast .btn{min-height:30px;background:rgba(230,233,236,.14);color:#fff;box-shadow:none}
/* Dashboard */
.qcard{display:flex;flex-direction:column}
.qh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px 8px}
.qi{display:grid;grid-template-columns:34px minmax(0,1fr) auto 108px;gap:14px;align-items:center;padding:0 20px;min-height:50px}
.qi+.qi{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
.qi .btn{justify-self:end}
.qic{width:34px;height:34px;border-radius:10px;background:var(--canvas);display:grid;place-items:center;color:var(--text-secondary)}
.qic.warn{background:var(--orange-100);color:var(--orange-600)}
.qic .i{width:17px;height:17px}
.qt{border:0;background:none;padding:2px 0;text-align:left;cursor:pointer;min-width:0;border-radius:6px}
.qt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 150ms var(--ease)}
.qt span{display:block;font-size:12.5px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qt:hover b{color:var(--vocia-primary-blue)}
.qf{margin-top:auto;padding:4px 20px 10px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:10px}
.kpi{display:flex;flex-direction:column;gap:1px}
.kpi b{font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.kpi b small{font-size:15px;font-weight:600;margin-left:1px}
.kpi .lbl{font-size:13px;font-weight:600}
.seg.z{background:var(--canvas);height:3px}
.health.sm{padding:7px 0}
.enter .qi{animation:rise 240ms var(--ease) both;animation-delay:calc(var(--i) * 40ms)}
.enter .bar{transform-origin:bottom;animation:grow 360ms var(--ease) both;animation-delay:calc(var(--i) * 18ms)}
@keyframes rise{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes grow{from{transform:scaleY(.2);opacity:0}to{transform:scaleY(1);opacity:1}}
.lkv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:13px}
.lkv dt{color:rgba(230,233,236,.6)}
.lkv dd{margin:0;color:#fff}
/* Questions */
.qs .row{grid-template-columns:minmax(0,1fr) 70px 110px 16px;min-height:56px}
/* Callback */
.callbox{padding:14px;border-radius:14px;background:var(--canvas);margin-top:16px}
.callbox.on{background:var(--blue-100);box-shadow:inset 0 0 0 1px var(--blue-300)}
.callbox .num{font-size:19px;font-weight:700;letter-spacing:.01em}
.att{display:grid;grid-template-columns:22px 130px 1fr;font-size:13px;padding:6px 0}
.att+.att{box-shadow:inset 0 1px 0 var(--vocia-soft-gray)}
/* Tagesnotiz */
.addon{margin:12px 0 0;display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--orange-100);color:var(--orange-900);font-size:13.5px}
.addon .i{width:16px;height:16px;margin-top:2px}
.modal.wide{width:580px}
.modal .dsec{margin-top:16px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.sugs .bchip{background:var(--canvas);box-shadow:none}
.sugs .bchip:hover{background:var(--vocia-soft-gray)}
.ferow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:6px;min-height:18px}
.ferow .ferr{margin:0}
.seglbl{font-size:13px;font-weight:600;margin:14px 0 6px}
.seg{display:flex;gap:4px;padding:4px;background:var(--canvas);border-radius:12px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-secondary);transition:background-color 150ms var(--ease),color 150ms var(--ease)}
.seg input:checked+span{background:var(--surface);color:var(--text-primary);box-shadow:var(--shadow-card)}
.seg input:focus-visible+span{outline:2px solid var(--vocia-primary-blue);outline-offset:1px}
/* Simplified surface language */
:root{--shadow-card:0 0 0 1px #E9EBED;--shadow-raised:0 0 0 1px #E6E9EC,0 1px 2px rgba(13,27,42,.05)}
.stage{background:var(--surface)}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
h3{font-size:15px;font-weight:600}
.lead{font-size:14px}
.card{border-radius:14px}
.stat{border-radius:14px}
.stat .big{font-weight:600}
.btn{border-radius:9px;min-height:34px;font-weight:600}
.pill{height:22px;padding:0 9px 0 8px;gap:6px;font-weight:500;box-shadow:none!important}
.pill .i{display:none}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.err{background:var(--canvas)}
.pill.err::before{background:var(--state-error)}
.pill.muted::before{background:var(--text-disabled)}
.list .row+.row{box-shadow:inset 0 1px 0 #F0F1F3}
.list .hd{min-height:36px}
.tabs2{display:flex;gap:26px;border-bottom:1px solid #E9EBED;flex:none;margin-top:-6px}
.tab2{border:0;background:none;padding:10px 0;margin-bottom:-1px;font-size:14px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;display:inline-flex;gap:7px;align-items:center;transition:color 150ms var(--ease)}
.tab2:hover{color:var(--text-primary)}
.tab2[aria-selected="true"]{color:var(--text-primary);font-weight:600;border-bottom-color:var(--text-primary)}
.tab2 .c{font-size:12px;color:var(--text-disabled);font-weight:500}
.stepper{display:flex;gap:2px;list-style:none;margin:0;padding:4px;background:var(--canvas);border-radius:12px}
.stp{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 12px 6px 7px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:background-color 150ms var(--ease)}
.stp:disabled{color:var(--text-disabled);cursor:default}
.stp[aria-current="step"]{background:var(--surface);color:var(--text-primary);box-shadow:0 0 0 1px #E6E9EC}
.stp .sd{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface);box-shadow:0 0 0 1px var(--outline)}
.stp .sd .i{width:11px;height:11px;stroke-width:2.5}
.stp[aria-current="step"] .sd{background:var(--vocia-primary-blue);color:#fff;box-shadow:none}
.stp.done .sd{background:var(--green-100);color:var(--green-900);box-shadow:none}
.kstrip{display:flex;gap:64px;flex:none}
.ks span{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:2px}
.ks b{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.ks b small{font-size:16px;font-weight:600;margin-left:1px}
.ks em{font-style:normal;font-size:12.5px;color:var(--text-secondary);margin-left:8px}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--vocia-fresh-green);margin-right:8px;box-shadow:0 0 0 3px rgba(43,196,138,.18);vertical-align:1px}
.qcard .qi{min-height:58px}
.body{align-items:start}
.derived>div.mid{background:var(--blue-100);color:var(--blue-900)}
.derived .mid small,.derived .mid .t2{color:var(--blue-900)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  termine:['Confirmed means written back','A booking is "confirmed" only after the calendar writes it back. Unconfirmed operations are never told to a patient as appointments.'],
  zeiten:['One event, one flow','A holiday is one object. Bookings, announcement and emergency contact are derived from it and shown on the row.'],
  ansage:['Tagesnotiz','The everyday version of the holiday flow: one sentence, an end time, a preview. It removes itself, so nobody has to remember to undo it.'],
  notfall:['Only verified contacts','Vocia names no unconfirmed numbers. Each holiday stores the date its contact was checked.'],
  integrationen:['Read vs. write','Each system shows what is read, what is written and what degrades if the connection fails.'],
  auswertung:['Quality over deflection','A low handoff rate only counts if the safe-resolution rate stays high. Handoff reasons point to the next roadmap item.'],
  einstellungen:['Trust settings in one place','Roles, 2FA and data retention are visible together; changes land in the audit log.'],
  fragen:['Learning loop','A question answered once is answered by Vocia from then on. Medical questions are never answered by Vocia, only acknowledged by the team.'],
  flow1:['"Wieder geöffnet am"','Teams think "we\'re back on Monday". Asking for the reopening day removes off-by-one mismatches.'],
  flow2:['Emergency before announcement','Once the contact is verified, the announcement names it automatically. No unverified number reaches a patient.'],
  flow3:['One source of truth','The text is generated from dates and contact. Edits are checked against them and against the AI disclosure.'],
  flow4:['Honest status language','Vocia says "I can note your request", never "your appointment is confirmed", during a closure.']
};
const DEF_SUB={anrufe:'alle',aufgaben:'offen'};
const subOf=v=>S.sub[v]||DEF_SUB[v]||null;

const NAVG=[['',[['dashboard','home','Dashboard'],['anrufe','phone','Anrufe'],['aufgaben','tasks','Aufgaben'],['termine','cal','Termine']]],['Einrichtung',[['zeiten','clock','Praxis & Zeiten'],['ansage','msg','Ansage & Telefon'],['notfall','alert','Notfall & Vertretung']]],['System',[['integrationen','plug','Integrationen'],['auswertung','chart','Auswertung'],['einstellungen','gear','Einstellungen']]]];

const tabs=(items,cur)=>`<div class="tabs2" role="tablist">${items.map(([id,l,c])=>`<button class="tab2" role="tab" aria-selected="${cur===id}" data-action="filter" data-id="${id}">${l}${c!=null?`<span class="c">${c}</span>`:''}</button>`).join('')}</div>`;
const head=(o)=>`<header class="head"><div>${o.eyebrow?`<p class="eyebrow">${o.eyebrow}</p>`:''}<h1 ${o.hid?`id="${o.hid}" tabindex="-1"`:''}>${o.title}</h1>${o.lead?`<p class="lead">${o.lead}</p>`:''}</div>${o.actions?`<div class="acts">${o.actions}</div>`:''}</header>`;
const planBtn=(origin,primary)=>`<button class="btn ${primary?'primary':''}" data-action="plan" data-origin="${origin}">${ic('sun')}Urlaub planen</button>`;

/* ---------- Dashboard ---------- */
const DEMO_NOW=15*60+10; /* Demo-Uhrzeit 15:10, passend zu den heutigen Beispielanrufen */
const LAST={calls:15,solved:9,hand:3};
const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const toM=s=>{const [h,m]=s.split(':').map(Number);return h*60+m};
function liveState(){
  const row=HOURS[(D(TODAY).getDay()+6)%7],segs=[row[1],row[2]].filter(Boolean).map(x=>x.split('–').map(toM)),n=DEMO_NOW;
  if(!segs.length)return {segs,title:'Praxis heute geschlossen',sub:'Vocia nimmt alle Anrufe an und notiert Rückrufbitten.'};
  const cur=segs.find(([a,b])=>n>=a&&n<b),next=segs.find(([a])=>n<a);
  if(cur)return {segs,title:'Sprechzeit',sub:`Vocia leitet an den Empfang weiter, wenn besetzt nimmt sie Rückrufbitten auf. Bis ${hm(cur[1])} Uhr.`};
  if(next)return {segs,title:n<segs[0][0]?'Vor der Sprechzeit':'Mittagspause',sub:`Vocia nimmt alle Anrufe an. Der Empfang ist ab ${hm(next[0])} Uhr wieder besetzt.`};
  return {segs,title:'Nach der Sprechzeit',sub:'Vocia nimmt alle Anrufe an und notiert Rückrufbitten für den nächsten Werktag.'};
}
function queue(){
  const q=[];
  TASKS.filter(t=>isOpen(t)&&t.cb).sort((a,b)=>(!!b.overdue-!!a.overdue)||((b.prio==='Hoch')-(a.prio==='Hoch'))).slice(0,3).forEach(t=>{
    const c=t.call&&CALLS.find(x=>x.id===t.call);
    q.push({icon:'phone',tone:t.overdue||t.prio==='Hoch'?'warn':'',title:t.title,sub:c&&c.op&&c.op.state==='no'?'Kalender war nicht erreichbar · Termin nicht bestätigt':t.reason,
      due:t.overdue?['Überfällig','warn','clock']:t.due.startsWith('Heute')?[t.due.replace('Heute, ','bis '),'info','clock']:['Morgen','muted','clock'],
      open:['openTask',t.id],btn:[`${ic('phone')}Anrufen`,'callTask',t.id,q.length===0]})});
  const oq=openQ().filter(x=>!x.medical).sort((a,b)=>b.n-a.n);
  if(oq.length)q.push({icon:'help',title:`${openQ().length} offene Fragen`,sub:`Am häufigsten: „${oq[0].q}“ (${oq[0].n}×)`,open:['go','anrufe','fragen'],btn:['Beantworten','openQ',oq[0].id]});
  q.push({icon:'cal',title:'Kalender-Berechtigung läuft ab',sub:'Danach übergibt Vocia alle Terminwünsche ans Team.',due:['In 12 Tagen','muted','clock'],open:['go','integrationen','kalender'],btn:['Erneuern','stub','']});
  return q;
}
const delta=(v,l,unit)=>{const d=v-l;return d===0?'wie Vorwoche':`${d>0?'+':'−'}${Math.abs(d)}${unit||''} ggü. Vorwoche`};
function dashboardView(){

    <div class="ks"><span>Übergeben</span><b>${hand}</b><em>${delta(hand,LAST.hand)}</em></div>

    <section class="col" id="sec-jetzt" style="align-self:start">

      <div class="card flat qcard">${q.length?q.map((x,i)=>`<div class="qi" style="--i:${i}"><span class="qic ${x.tone}">${ic(x.icon)}</span>
        <button class="qt" data-action="${x.open[0]}" ${x.open[0]==='go'?`data-view="${x.open[1]}" data-sub="${x.open[2]}"`:`data-id="${x.open[1]}"`}><b>${x.title}</b><span>${esc(x.sub)}</span></button>
        ${x.due?pill(x.due):'<span></span>'}<button class="btn sm ${x.btn[3]?'primary':''}" data-action="${x.btn[1]}" data-id="${x.btn[2]}">${x.btn[0]}</button></div>`).join('')
      :`<div class="empty">${ic('checkc')}<b>Alles erledigt</b>Neue Rückrufe und Fragen erscheinen hier automatisch.</div>`}</div>
      <p class="cap" style="margin:0">Seit gestern 18:00 Uhr: 4 Anrufe außerhalb der Sprechzeiten, alle mit Rückrufbitte.</p>
    </section>
    <section class="col" style="align-self:start">
      <div class="card" id="sec-heute">
        <div class="ch"><h3>Anrufe pro Stunde</h3><div class="legend"><span><i style="background:var(--vocia-primary-blue)"></i>Gelöst</span><span><i style="background:var(--blue-300)"></i>Übrige</span></div></div>
        <div class="chart" style="grid-template-columns:repeat(13,minmax(0,1fr));gap:10px;flex:none;height:190px" role="img" aria-label="Anrufe pro Stunde: ${H.filter(x=>x.s+x.o).map(x=>`${x.h} Uhr ${x.s+x.o}`).join(', ')}">

        <div class="xl" style="grid-template-columns:repeat(13,minmax(0,1fr));gap:10px">${H.map(x=>`<span>${x.h%3===1?String(x.h).padStart(2,'0'):''}</span>`).join('')}</div>

        <div class="health sm">${ic('phone')}<div class="bd">Telefonanlage</div>${pill(['Aktiv','ok','checkc'])}</div>

      </div>
    </section>
  </div></div>`;
}

/* ---------- Aufgaben ---------- */
const TVIEWS={offen:t=>isOpen(t),meine:t=>isOpen(t)&&t.owner===ME,heute:t=>isOpen(t)&&t.due.startsWith('Heute'),ueberfaellig:t=>isOpen(t)&&!!t.overdue,rueckrufe:t=>isOpen(t)&&t.cb};

const STEPS=['Zeitraum & Termine','Notfall & Vertretung','Ansage','Prüfen & veröffentlichen'];
function gen(d){
  let t=`Willkommen bei der ${PRAXIS}. Hier spricht Vocia, die digitale Assistentin der Praxis. Die Praxis ist im Urlaub und ab ${long(d.reopen)} wieder für Sie da.`;
  if(d.mention){
    if(d.emergency==='vertretung'&&d.vName.trim()&&d.vPhone.trim())t+=` In dringenden Fällen wenden Sie sich bitte an unsere Vertretung, ${d.vName.trim()}, Telefon ${d.vPhone.trim()}.`;
    else if(d.emergency==='standard')t+=` In dringenden Fällen erreichen Sie den zahnärztlichen Notdienst unter ${STD.phone}.`;
  }
  return t+' Gerne nehme ich Ihr Anliegen auf, damit sich das Praxisteam nach dem Urlaub bei Ihnen meldet.';
}
const ansageOf=d=>d.edited?d.ansage:gen(d);
function errs1(d){const e={};
  if(!d.start)e.start='Bitte wählen Sie den ersten geschlossenen Tag.';
  else if(d.start<TODAY&&!S.editingId)e.start='Der Urlaub kann nicht in der Vergangenheit beginnen.';
  if(!d.reopen)e.reopen='Bitte wählen Sie den Tag, an dem die Praxis wieder öffnet.';
  else if(d.start&&d.reopen<=d.start)e.reopen='Muss nach dem ersten geschlossenen Tag liegen.';
  return e}
function errs2(d){const e={};
  if(d.emergency==='vertretung'){if(!d.vName.trim())e.vName='Bitte geben Sie den Namen der Vertretungspraxis an.';if(!d.vPhone.trim())e.vPhone='Bitte geben Sie eine Telefonnummer an.'}
  if(!d.verified)e.verified='Bitte bestätigen Sie, dass Sie die Angaben geprüft haben.';
  return e}
function warn3(d){const t=ansageOf(d),w=[];
  if(!t.trim())return ['Die Ansage ist leer. Vocia braucht einen Text.'];
  if(!/digitale Assistentin|KI|Vocia/.test(t))w.push('Der Hinweis, dass hier eine digitale Assistentin spricht, fehlt.');
  if(d.edited&&!t.includes(long(d.reopen))&&!t.includes(fmtS(d.reopen)))w.push(`Der Tag der Wiedereröffnung (${long(d.reopen)}) fehlt im Text.`);
  if(d.edited&&d.mention&&d.emergency==='vertretung'&&d.vName.trim()&&!t.includes(d.vName.trim()))w.push(`Die Vertretung (${d.vName.trim()}) wird im Text nicht genannt.`);
  return w}
const stepErrs=n=>n===1?errs1(S.draft):n===2?errs2(S.draft):n===3&&!ansageOf(S.draft).trim()?{ansage:'leer'}:{};
const overlaps=d=>S.items.filter(i=>i.id!==S.editingId&&i.start<=lastDay(d)&&i.end>=d.start);
const apptsIn=d=>APPTS.filter(a=>a.d>=d.start&&a.d<=lastDay(d));
const fieldErr=(n,k,e)=>S.tried[n]&&e[k]?`<p class="ferr" id="e-${k}">${ic('err')}<span>${e[k]}</span></p>`:'';
const inv=(n,k,e)=>S.tried[n]&&e[k]?`aria-invalid="true" aria-describedby="e-${k}"`:'';

      <div class="field"><label for="f-reopen">Wieder geöffnet am</label><input id="f-reopen" type="date" value="${d.reopen}" data-field="reopen" ${inv(1,'reopen',e)}>${fieldErr(1,'reopen',e)}</div></div>
    ${ok?`<div class="derived"><div><small>Letzter Öffnungstag</small><b>${long(lastOpen(d.start))}</b></div><div class="mid"><small>Geschlossen</small><b>${fmtS(d.start)} – ${fmtS(lastDay(d))}</b><div class="t2">${workdays(d)} Werktage</div></div><div><small>Wieder geöffnet</small><b>${long(d.reopen)}</b></div></div>`:''}
    ${ov.length?`<div class="msg warn">${ic('alert')}<div class="bd"><b>Überschneidung:</b> ${ov.map(x=>`${x.kind} ${fmtS(x.start)}–${fmtS(x.end)}`).join(', ')}. Bitte prüfen Sie, ob beide Einträge nötig sind.</div></div>`:''}`,
  right:`<section class="card soft" style="padding:18px"><h3 style="margin-bottom:12px">Termine</h3>
      <label class="check boxed" style="background:var(--surface)"><input type="checkbox" data-field="block" ${d.block?'checked':''}><span>Keine neuen Termine in diesem Zeitraum<small>Vocia vergibt telefonisch keine Termine. Endet automatisch mit dem Urlaub.</small></span></label>
      ${!ok?'':a.length?`<div class="msg warn">${ic('alert')}<div class="bd"><b>${a.length} bestehende ${a.length===1?'Termin liegt':'Termine liegen'} im Zeitraum.</b> Vocia sagt sie nicht automatisch ab. Bitte umbuchen.
        <ul class="appts">${a.map(x=>`<li><span>${WD[D(x.d).getDay()].slice(0,2)}, ${fmt(x.d)}</span><span>${x.t}</span><span>${x.what}</span></li>`).join('')}</ul></div></div>`
      :`<div class="msg ok">${ic('checkc')}<div class="bd">Keine bestehenden Termine im Zeitraum.</div></div>`}</section>`};
}
function step2(d){
  const e=errs2(d);

  left:`<fieldset style="border:0;padding:0;margin:0"><legend class="sr">Notfallkontakt</legend><div class="opts" style="grid-template-columns:1fr 1fr">
      <label class="opt"><input type="radio" name="emergency" value="standard" data-field="emergency" ${d.emergency==='standard'?'checked':''}><div><b>Standard-Notdienst</b><span>${STD.phone}</span></div></label>
      <label class="opt"><input type="radio" name="emergency" value="vertretung" data-field="emergency" ${d.emergency==='vertretung'?'checked':''}><div><b>Vertretungspraxis</b><span>Kollegenpraxis übernimmt</span></div></label></div></fieldset>
    ${d.emergency==='vertretung'?`<div class="vform" style="margin-top:12px">

      <div class="grid2">
        <div class="field"><label for="f-vName">Name der Praxis</label><input id="f-vName" type="text" autocomplete="off" value="${esc(d.vName)}" data-field="vName" data-live="1" ${inv(2,'vName',e)}>${fieldErr(2,'vName',e)}</div>
        <div class="field"><label for="f-vPhone">Telefonnummer</label><input id="f-vPhone" type="tel" value="${esc(d.vPhone)}" data-field="vPhone" data-live="1" ${inv(2,'vPhone',e)}>${fieldErr(2,'vPhone',e)}</div></div>
      <div class="field"><label for="f-vAddr">Adresse <em>(optional)</em></label><input id="f-vAddr" type="text" value="${esc(d.vAddr)}" data-field="vAddr" data-live="1"></div></div>`
    :`<div class="msg info">${ic('info')}<div class="bd">${STD.type}, ${STD.phone}. Zuletzt geprüft am ${fmt(STD.checked)}.</div></div>`}`,
  right:`<div style="display:grid;gap:8px">
    <label class="check boxed"><input type="checkbox" data-field="mention" ${d.mention?'checked':''}><span>Notfallkontakt direkt in der Ansage nennen<small>Viele Anrufer fragen sonst trotzdem nach.</small></span></label>
    <label class="check boxed ${S.tried[2]&&e.verified?'invalid':''}"><input id="f-verified" type="checkbox" data-field="verified" ${d.verified?'checked':''} ${inv(2,'verified',e)}><span>Ich habe die Angaben geprüft<small>Name, Telefonnummer und Erreichbarkeit während des Urlaubs. Das Prüfdatum wird gespeichert.</small></span></label>
    ${fieldErr(2,'verified',e)}</div>`};
}
function step3(d){
  const w=warn3(d);
  return {title:'Was hören Anrufer?',lead:'Der Text wurde aus Zeitraum und Notfallkontakt erstellt. Sie können ihn anpassen.',cols:'1.5fr 1fr',
  left:`<div class="field"><label for="f-ansage">Urlaubsansage</label><textarea id="f-ansage" data-field="ansage" data-live="1">${esc(ansageOf(d))}</textarea></div>
    <div class="toolrow"><button class="btn" data-action="listen">${ic('play')}Anhören</button><button class="btn ghost" id="regenBtn" data-action="regen" ${d.edited?'':'hidden'}>${ic('refresh')}Text neu erstellen</button></div>
    <div id="ansWarn" aria-live="polite">${w.map(x=>`<div class="msg warn">${ic('alert')}<div class="bd">${esc(x)}</div></div>`).join('')}</div>`,
  right:`<section class="card soft legal" style="padding:18px"><h3 style="margin-bottom:10px">Datenschutz & Transparenz</h3><ul>
    <li>Anrufer müssen erfahren, dass sie mit einer digitalen Assistentin sprechen. Der Hinweis wird geprüft.</li>

function step4(d){
  const last=lastDay(d),a=apptsIn(d),active=d.start<=TODAY;
  const emerg=d.emergency==='vertretung'?`Bitte wenden Sie sich an unsere Vertretung, <mark>${esc(d.vName)}</mark>, Telefon <mark>${esc(d.vPhone)}</mark>.`:`Bitte wenden Sie sich an den zahnärztlichen Notdienst unter <mark>${STD.phone}</mark>.`;

  return {title:'So erlebt ein Anrufer Ihren Urlaub',lead:'Ein Beispielgespräch mit Ihren Einstellungen. Prüfen Sie es und veröffentlichen Sie den Urlaub.',cols:'1.35fr 1fr',
  left:`<div class="sim" style="height:100%"><div class="simhd"><span>Beispielanruf am ${long(active?TODAY:d.start)}</span><button class="btn sm" data-action="listen">${ic('play')}Ansage anhören</button></div>
    <div class="conv">
      <div class="m v"><div class="who">Vocia</div><div class="txt">${esc(ansageOf(d))}</div></div>

      <div class="m c"><div class="who">Anrufer</div><div class="txt">Mir ist ein Bracket abgebrochen und es tut weh.</div></div>
      <div class="m v"><div class="who">Vocia</div><div class="txt">${emerg}</div></div></div></div>`,
  right:`<section class="card summary" style="padding:4px 20px"><div class="ci">${ic('checkc','ok')}<div>${fmtS(d.start)} – ${fmtS(last)} geschlossen<small>Wieder geöffnet ${long(d.reopen)} · ${d.block?'keine neuen Termine':'Termine buchbar'}</small></div><button class="btn ghost sm" data-action="step" data-step="1">Ändern</button></div>
    ${a.length?`<div class="ci">${ic('alert','wn')}<div>${a.length} bestehende ${a.length===1?'Termin':'Termine'} im Zeitraum<small>Werden nicht automatisch abgesagt</small></div><button class="btn ghost sm" data-action="step" data-step="1">Ansehen</button></div>`:''}
    <div class="ci">${ic('checkc','ok')}<div>Notfälle: ${d.emergency==='vertretung'?esc(d.vName):'Standard-Notdienst'}<small>Geprüft am ${fmt(d.verifiedOn||TODAY)}${d.mention?' · in der Ansage genannt':''}</small></div><button class="btn ghost sm" data-action="step" data-step="2">Ändern</button></div>
    <div class="ci">${ic('checkc','ok')}<div>Urlaubsansage<small>Danach automatisch wieder Standard-Begrüßung</small></div><button class="btn ghost sm" data-action="step" data-step="3">Ändern</button></div></section>
    <div class="msg info">${ic('info')}<div class="bd">${active?'<b>Der Urlaub läuft bereits.</b> Änderungen gelten sofort.':`Wird am <b>${long(d.start)}</b> um 00:00 Uhr aktiv und endet vor der Öffnung am <b>${long(d.reopen)}</b>.`}</div></div>`};
}
function stepper(){return `<ol class="stepper" aria-label="Schritte">${['Zeitraum','Notfall','Ansage','Prüfen'].map((t,i)=>{const n=i+1,cur=n===S.step,done=!cur&&n<S.maxStep;
  return `<li><button class="stp ${done?'done':''}" data-action="step" data-step="${n}" ${n>S.maxStep?'disabled':''} ${cur?'aria-current="step"':''}><span class="sd">${done?ic('check'):n}</span>${t}</button></li>`}).join('')}</ol>`}
function flowView(){
  const v=[step1,step2,step3,step4][S.step-1](S.draft);

  t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>{t.classList.remove('show');undoFn=null},undo?6000:2600)}
function speak(text){try{if(!('speechSynthesis' in window))throw 0;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';speechSynthesis.speak(u);toast('Wird vorgelesen')}catch(_){toast('Vorlesen wird in diesem Browser nicht unterstützt')}}
const leaveFlow=()=>{S.view=S.origin;S.draft=null;S.editingId=null;S.dirty=false;S.tried={}};
const nowHM=()=>{const n=new Date();return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const a=el.dataset.action,d=S.draft;
  switch(a){
    case 'stub':toast('Nicht Teil dieses Prototyps');return;
    case 'nav':{const to=el.dataset.view;
      if(S.view==='flow'&&S.dirty){S.modal={type:'discard',then:to};break}
      if(S.view==='flow')leaveFlow();
      S.drawer=null;S.view=to;S.origin=to;S.banner=null;S.enter=to==='dashboard';break}
    case 'filter':S.sub[S.view]=el.dataset.id;break;
    case 'go':{const to=el.dataset.view,sub=el.dataset.sub;S.drawer=null;S.view=to;S.origin=to;S.banner=null;if(sub){S.sub[to]=sub;if(!DEF_SUB[to])S.flash=sub}break}
    case 'openQ':{const q=QUESTIONS.find(x=>x.id===el.dataset.id);S.qDraft=q.a||'';S.qErr=false;S.drawer={type:'q',id:q.id,ret:`[data-action="openQ"][data-id="${q.id}"]`};S.focus=q.medical?'#dtitle':'#qa';break}
    case 'saveQ':{const q=QUESTIONS.find(x=>x.id===el.dataset.id);if(!S.qDraft.trim()){S.qErr=true;S.focus='#qa';break}
      const prev={status:q.status,a:q.a};q.a=S.qDraft.trim();q.status='answered';S.drawer=null;
      toast('Antwort gespeichert. Vocia beantwortet die Frage ab jetzt selbst.',()=>{q.status=prev.status;q.a=prev.a;render()});break}
    case 'ignoreQ':{const q=QUESTIONS.find(x=>x.id===el.dataset.id);q.status='ignored';S.drawer=null;toast('Frage ignoriert',()=>{q.status='open';render()});break}
    case 'ackQ':{const q=QUESTIONS.find(x=>x.id===el.dataset.id);q.status='team';S.drawer=null;toast('Zur Kenntnis genommen',()=>{q.status='open';render()});break}
    case 'callTask':{const t=TASKS.find(x=>x.id===el.dataset.id);S.drawer={type:'task',id:t.id,ret:`[data-action="callTask"][data-id="${t.id}"]`};S.calling=t.id;t.owner=ME;t.status='bearbeitung';S.focus='#dtitle';break}
    case 'callnow':{const t=TASKS.find(x=>x.id===el.dataset.id);S.calling=t.id;t.owner=ME;t.status='bearbeitung';break}
    case 'cbres':{const t=TASKS.find(x=>x.id===el.dataset.id),r=el.dataset.r,prev={status:t.status,due:t.due,overdue:t.overdue,n:t.attempts.length};
      const stamp='Heute, '+nowHM();S.calling=null;
      const undo=()=>{t.status=prev.status;t.due=prev.due;t.overdue=prev.overdue;t.attempts.length=prev.n;render()};
      if(r==='ok'){t.attempts.push({t:stamp,r:'Erreicht'});t.status='erledigt';S.drawer=null;toast(`${t.id} erledigt`,undo)}
      else if(r==='nicht'){t.attempts.push({t:stamp,r:'Nicht erreicht'});t.due=plus2h();t.overdue=false;toast(`Nicht erreicht. Nächster Versuch: ${t.due}`,undo)}
      else{t.attempts.push({t:stamp,r:'Nachricht auf Mailbox'});t.status='wartet';toast('Mailbox-Nachricht vermerkt',undo)}
      break}
    case 'noteEdit':S.noteDraft=S.note?{...S.note}:{text:'',until:0};S.noteErr=false;S.modal={type:'note',ret:'[data-action="noteEdit"]'};break;
    case 'sugg':S.noteDraft.text=SUGG[+el.dataset.i];S.noteErr=false;break;
    case 'noteListen':speak(noteSpeech(S.noteDraft.text));return;
    case 'noteSave':if(!S.noteDraft.text.trim()){S.noteErr=true;break}
      S.note={text:S.noteDraft.text.trim(),until:S.noteDraft.until};S.modal=null;S.focus='[data-action="noteEdit"]';toast('Tagesnotiz ist aktiv');break;
    case 'noteEnd':{const prev=S.note;S.note=null;toast('Tagesnotiz beendet',()=>{S.note=prev;render()});break}
    case 'sayGreet':speak(S.note?noteSpeech(S.note.text):GREET+' Wie kann ich Ihnen helfen?');return;
    case 'anchor':S.sub[S.view]=el.dataset.id;S.flash=el.dataset.id;break;
    case 'plan':S.origin=el.dataset.origin||'zeiten';S.draft=newDraft();S.editingId=null;S.step=1;S.maxStep=1;S.dirty=false;S.tried={};S.banner=null;S.view='flow';S.focus='#steph';break;
    case 'edit':{const it=S.items.find(i=>i.id===+el.dataset.id);if(!it||!it.draft)return;
      S.origin=S.view;S.draft=JSON.parse(JSON.stringify(it.draft));S.editingId=it.id;S.step=+(el.dataset.step||4);S.maxStep=4;S.dirty=false;S.tried={};S.banner=null;S.view='flow';S.focus='#steph';break}
    case 'delete':S.modal={type:'delete',id:+el.dataset.id,ret:`[data-action="delete"][data-id="${el.dataset.id}"]`};break;
    case 'closeModal':if(el.classList.contains('overlay')&&e.target!==el)return;{const r=S.modal&&S.modal.ret;S.modal=null;S.focus=r||null}break;
    case 'confirmDelete':{const it=S.items.find(i=>i.id===S.modal.id);S.items=S.items.filter(i=>i.id!==S.modal.id);S.modal=null;S.banner=`${it.kind} ${fmtS(it.start)}–${fmtS(it.end)} wurde gelöscht.`;break}
    case 'discard':{const to=S.modal.then;S.modal=null;leaveFlow();if(to){S.view=to;S.origin=to}break}
    case 'dismiss':S.banner=null;break;
    case 'openCall':S.drawer={type:'call',id:el.dataset.id,ret:S.drawer?S.drawer.ret:`[data-id="${el.dataset.id}"]`};S.focus='#dtitle';break;
    case 'openTask':
      if(S.view!=='aufgaben'&&!S.drawer){S.view='aufgaben';S.origin='aufgaben'}
      S.drawer={type:'task',id:el.dataset.id,ret:S.drawer?S.drawer.ret:`[data-action="openTask"][data-id="${el.dataset.id}"]`};S.focus='#dtitle';break;
    case 'closeDrawer':{const r=S.drawer&&S.drawer.ret;S.drawer=null;S.calling=null;S.focus=r;break}
    case 'assign':{const t=TASKS.find(x=>x.id===el.dataset.id);t.owner=ME;if(t.status==='neu')t.status='zugewiesen';toast(`${t.id} ist Ihnen zugewiesen`);break}
    case 'done':{const t=TASKS.find(x=>x.id===el.dataset.id);const prev={status:t.status,owner:t.owner};t.status='erledigt';t.owner=t.owner||ME;S.drawer=null;
      toast(`${t.id} als erledigt markiert`,()=>{t.status=prev.status;t.owner=prev.owner;render()});break}
    case 'reopen':{const t=TASKS.find(x=>x.id===el.dataset.id);t.status=t.owner?'zugewiesen':'neu';toast(`${t.id} wieder geöffnet`);break}
    case 'undo':if(undoFn){undoFn();undoFn=null;document.getElementById('toast').classList.remove('show')}return;
    case 'testcall':S.test={state:'busy',at:S.test.at};render();setTimeout(()=>{S.test={state:'ok',at:`Heute, ${nowHM()}`};render()},1400);return;
    case 'intcheck':{const id=el.dataset.id;S.intCheck[id]='busy';render();setTimeout(()=>{S.intCheck[id]='ok';render()},1000);return}
    case 'say':speak(el.dataset.text);return;
    case 'step':{const n=+el.dataset.step;if(n>S.maxStep)return;S.step=n;S.focus='#steph';break}
    case 'next':{const er=stepErrs(S.step);
      if(Object.keys(er).length){S.tried[S.step]=true;render();const f=document.querySelector('[aria-invalid="true"]');if(f)f.focus();return}
      if(S.step===2&&!d.verifiedOn)d.verifiedOn=TODAY;
      S.step++;S.maxStep=Math.max(S.maxStep,S.step);S.focus='#steph';break}
    case 'back':S.step=Math.max(1,S.step-1);S.focus='#steph';break;
    case 'cancel':if(S.dirty){S.modal={type:'discard'};break}leaveFlow();break;
    case 'useLast':d.vName=LAST_V.name;d.vPhone=LAST_V.phone;d.vAddr=LAST_V.addr;S.dirty=true;break;
    case 'regen':d.edited=false;d.ansage='';break;
    case 'listen':speak(ansageOf(d));return;
    case 'publish':{if(S.busy)return;S.busy=true;render();
      setTimeout(()=>{const saved=JSON.parse(JSON.stringify(d));saved.ansage=ansageOf(d);saved.verifiedOn=d.verifiedOn||TODAY;
        const item={id:S.editingId||Date.now(),kind:'Urlaub',start:d.start,end:lastDay(d),draft:saved};
        S.items=S.editingId?S.items.map(i=>i.id===S.editingId?item:i):[...S.items,item];
        S.banner=item.start<=TODAY?`<b>Urlaub ${fmtS(item.start)}–${fmtS(item.end)} veröffentlicht.</b> Die Änderungen sind jetzt aktiv.`:`<b>Urlaub ${fmtS(item.start)}–${fmtS(item.end)} veröffentlicht.</b> Vocia übernimmt ihn automatisch am ${long(item.start)}.`;
        S.busy=false;leaveFlow();S.view='zeiten';S.origin='zeiten';S.sub.zeiten='urlaub';render()},700);return}
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.nf==='until'){S.noteDraft.until=+t.value;return}
  const f=t.dataset&&t.dataset.field;if(!f)return;
  if(f==='notes'){S.notes=t.checked;render();return}
  const d=S.draft;if(!d||t.dataset.live)return;
  S.dirty=true;
  if(t.type==='checkbox'){d[f]=t.checked;if(f==='verified')d.verifiedOn=t.checked?TODAY:null}
  else if(t.type==='radio'){d[f]=t.value;if(f==='emergency'){d.verified=false;d.verifiedOn=null}}
  else if(t.type==='date'){d[f]=t.value;if(f==='start'&&d.start&&d.reopen&&d.reopen<=d.start)d.reopen=addDays(d.start,7)}
  S.focus=t.type==='radio'?`input[name="${t.name}"][value="${t.value}"]`:'#'+t.id;
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.nf==='text'){S.noteDraft.text=t.value;document.getElementById('ntc').textContent=t.value.length+'/160';document.getElementById('ntp').textContent=noteSpeech(t.value);return}
  if(t.dataset&&t.dataset.qa){S.qDraft=t.value;document.getElementById('qac').textContent=t.value.length+'/240';const p=document.getElementById('qprev');if(t.value.trim())p.textContent=t.value;else p.innerHTML='<span class="t2">Ihre Antwort erscheint hier.</span>';return}
  if(!t.dataset||!t.dataset.live||!S.draft)return;
  const d=S.draft;S.dirty=true;
  if(t.dataset.field==='ansage'){d.ansage=t.value;d.edited=true}
  else{d[t.dataset.field]=t.value;d.verified=false;d.verifiedOn=null;const v=document.getElementById('f-verified');if(v)v.checked=false}
  refreshLive();
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(S.modal){const r=S.modal.ret;S.modal=null;S.focus=r||null;render()}
  else if(S.drawer){const r=S.drawer.ret;S.drawer=null;S.calling=null;S.focus=r;render()}
});
addEventListener('beforeunload',e=>{if(S.view==='flow'&&S.dirty){e.preventDefault();e.returnValue=''}});
render();
})();
</script>
</body>
</html>
